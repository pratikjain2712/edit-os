[project]
name = "edit-os"
version = "0.1.0"
description = "Copy editing and style editing for journal manuscripts"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "anthropic>=1.16",
    "openpyxl>=3.1",
    "pillow>=10",  # figure files from the zip: TIFF / BMP / GIF -> PNG, oversized pictures scaled down
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27", "edit-os[server]"]

[tool.setuptools.packages.find]
include = ["edit_os*"]  # server/, integrations/, web/ are not part of the library

[tool.setuptools.package-data]
edit_os = ["styles/*.yaml", "copyedit/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
