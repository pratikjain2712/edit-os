# Indian Journal of Community Medicine (StyleSheet_IJCM_New.docx); only the settings that differ from base.yaml.
# Tuned against 3 style-edited articles: closure 11.8% (hurt 3) -> 12.3% (hurt 0) (base only -> this file).
name: Indian Journal of Community Medicine

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]
  # base list + limitations (the editor tags these <H2>)
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, acknowledgment, acknowledgments, acknowledgement,
       acknowledgements, author contribution statement, author contributions,
       data availability statement, ethical approval, ethics approval, limitations]

statistics:
  space_around_operators: false  # the editor leaves p=0.03 as typed

# not yet automated:
#   - H1 in Title case
#   - structured abstract: sub-headings in separate paragraphs
#   - abstract word limits: structured 250, unstructured 150 (query if exceeded)
#   - Graph/Chart/Diagram/Video citations -> 'Figure X'
