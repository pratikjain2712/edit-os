# Neurology India (StyleSheet_Sample_NI_New.docx); only the settings that differ from base.yaml.
# Tuned against 13 style-edited articles: closure 16.7% (hurt 34) -> 16.9% (hurt 29) (base only -> this file).
name: Neurology India

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]

# not yet automated:
#   - Key Messages after Keywords in original, review, case report and brief articles (query if missing)

formatting:  # measured with tools/eval_format.py against the style editors' tracked files
  remove_font_color: false  # editors keep the author's colours (4 of 30)

sections:
  back_matter:
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'

front_matter:  # (was front_matter.journals.neurol in base.yaml: here it applies under either code)
  title_case: title  # S: "Article title | Title case"
  cite_journal: Neurol India
