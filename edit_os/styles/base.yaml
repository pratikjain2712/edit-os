# Shared Wolters Kluwer - Medknow style. Journal files override any key.
name: Base (Medknow)

citations:
  brackets: square          # (4) -> [4]
  after_punctuation: true   # "region (4)." -> "region.[4]"
  multiple_delimiter: ","   # [1,2,4], no space
  range_dash: "-"           # [6–9] -> [6-9]
  two_number_range_as_list: true  # [1-2] -> [1,2]

headings:
  tag: true  # prefix headings with <H1> / <H2> for typesetting
  h1: [abstract, introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references,
       case report, case reports, case presentation, review of literature]
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, acknowledgment, acknowledgments, acknowledgement,
       acknowledgements, author contribution statement, author contributions, data availability statement,
       ethical approval, ethics approval]
  strip_trailing_colon: true

statistics:
  space_around_operators: true  # p=0.03 -> p = 0.03

guide_replace:  # the pre-editing guide's search-and-replace table (edit_os/rules_guide.py), body text only
  # On by default: what the editors were measured to do on real articles (style + copy edit).
  et_al_period: true          # "Smith et al reported" -> "Smith et al. reported"
  ampersand: true             # "anxiety & depression" -> "anxiety and depression" (not references, not "Jammu & Kashmir")
  operator_spacing: true      # "5.2±1.3" -> "5.2 ± 1.3"; off when statistics.space_around_operators is off, unless "always"
  operators: "+±"
  percent_space: true         # "50 %" -> "50%"
  value_unit_space: true      # "123mg" -> "123 mg"
  units: [μg, µg, μs, µs, Hertz, μL, µL, μl, µl, mm, cm, km, mg, rpm, nm]
  bracket_inner_space: true   # "( 80 )" -> "(80)"
  double_period: true         # "80.." -> "80."
  multiplication: true        # "10x20" -> "10 × 20"
  # Off by default: in the guide, but the editors mostly leave it (see the measurement in rules_guide.py).
  nbsp: false                 # non-breaking space -> space
  unary_minus: false          # "of -1.53" -> "of −1.53"
  unary_comparison: false     # "(> 250 μm)" -> "(>250 μm)"
  value_bracket_space: false  # "20(80)" -> "20 (80)"
  degree_space: false         # "29 °C" -> "29°C"
  technetium: false           # "99 mTc" -> "99mTc"
  p_value_capital: false      # "p = 0.03" -> "P = 0.03" (copy editors, sometimes)
  include_tables: false

references:
  lookup: true                 # rebuild entries from PubMed / CrossRef when they match strictly
  ai_parse: true               # Claude splits entries into fields first (needs ANTHROPIC_API_KEY)
  max_authors: 6               # more than 6 -> first 6, et al.
  et_al: "et al."
  initials_without_periods: true  # "Lindqvist P.," -> "Lindqvist P,"
  page_range_compress: true    # 101-109 -> 101-9
  page_range_dash: "-"
  drop_issue: true             # 2017;12(3):101-9 -> 2017;12:101-9
  no_period_before_year: true  # J Med Genet. 1987;24 -> J Med Genet 1987;24
  capitalize_after_colon: true # "dermoid: a case report" -> "dermoid: A case report"
  title_sentence_case: true    # "Treatment of Metastatic Cancer" -> "Treatment of metastatic cancer"
  journal_abbreviation: nlm    # Index Medicus abbreviation from NLM's journal list
  journal_drop_qualifier: true # "Spine (Phila Pa 1976)" -> "Spine", as the editors do
  other:                       # books, links, conference papers, reports, theses (refs_other.py)
    enabled: true              # template fixes: "Available from: URL. [Last accessed on 2010 Jul 10].", "4th ed."
    check_links: true          # open each URL: dead links, soft 404s and redirects become queries
    verify_books: true         # look books up in CrossRef and Open Library
    query_unverified: true     # conference papers, reports, theses: query that they could not be verified

keywords:
  min: 3
  max: 5
  alphabetical: true

required_sections:  # in the order the style editors add them before the references
  - {heading: Financial support and sponsorship, default: "Nil."}
  - {heading: Conflicts of interest, default: "There are no conflicts of interest."}
expected_h1: [conclusion]

formatting:  # run formatting from the pre-editing guide, rendered as tracked formatting
  enabled: true
  et_al_italic: true           # body "et al." in italics (never in the reference list)
  et_al_period: true           # "et al" -> "et al."
  latin_italic: true           # in vivo, in vitro, in situ, ex vivo
  p_values: true               # probability P in italics
  p_capital: false             # "p < 0.05" -> "P < 0.05": copy-edit pass (style editors leave p as typed)
  n_variable_italic: true      # "n = 34": italic n
  superscript_citations: true  # body citations [4] in superscript

figures:                        # figure and table citations and captions (rules_figures.py)
  citations: true
  brackets: square              # (Figure 1) -> [Figure 1]
  figure_label: Figure          # "Fig. 1" -> "Figure 1" (every journal but IJO in the editors' files)
  figure_label_plural: Figures
  part_labels: lower            # Figure 1A -> Figure 1a: what the editors do (the guide says uppercase)
  part_case_query: false
  range_dash: "–"               # "Tables 1 to 3" -> "Tables 1–3"
  compress_lists: false         # "Tables 1, 2 and 3" -> "Tables 1–3"
  captions: true
  caption_separator: ": "       # "Table 1. Title" -> "Table 1: Title"
  caption_end_period: false     # delete the period at the end of a caption
  queries: true                 # out of order, cited without caption, caption never cited

renumber:                       # duplicate references and citation-order renumbering (renumber.py)
  enabled: true
  remove_duplicates: true       # guide E.g. 3
  reorder: true                 # guide E.g. 4; never when a reference is uncited (E.g. 5)
  compress_from: 3              # renumbered [4,5,6] -> [4-6]; two numbers stay a list

sections:  # headings, abstract, key words, back matter (edit_os/rules_sections.py)
  enabled: true
  headings:
    strip_numbering: true      # "1. Introduction" -> "Introduction" (recognised headings only)
    title_minor_words: true    # "Materials And Methods" -> "Materials and Methods"
    case: keep                 # H1 text case: keep | upper | title | sentence (editors mostly keep)
    rename: {}                 # e.g. {materials and methods: Methods}; the guide's "Methods" ->
                               # "Materials and Methods" is not what the editors do
    drop: []                   # headings the journal does not print, e.g. [introduction]
    bold: false                # bold recognised headings (most are bold already)
  abstract:
    heading: Abstract
    add_heading: true            # insert "Abstract" before an abstract that has none
    split_inline_heading: true   # "Abstract: text" -> heading paragraph + text
    strip_heading_colon: true    # "Abstract:" -> "Abstract"
    subheading_colon: true       # "Purpose:To" -> "Purpose: To"; "Methods" on its own line -> "Methods: "
    subheading_case: keep        # keep | title | upper (guide: caps; stylesheets: title case)
    subheading_bold: false
    rename: {}                   # e.g. {materials and methods: Methods}: most stylesheets ask for it and
                                 # the IJO / NJCP / AIAN editors do it, but ABR and JCRT editors keep it
    citation_query: true         # citations in the abstract -> author query
    word_limit_query: false      # stylesheets say so; the editors do not query it
    word_limit: {structured: 250, unstructured: 150}
    structured_case_report_query: true  # editors' query: case reports have no structured abstract
  keywords:
    heading: "Keywords:"         # every stylesheet; the generic guide says "Key words:"
    fix_heading: true
    delimiter: ", "
    sort: true                   # with keywords.alphabetical
    case: true                   # first keyword capitalised, others lower case unless proper nouns
    drop_final_period: true
    dedupe: true
    add_missing: true            # add the "Keywords:" line after the abstract and query
    max_query: false             # more than keywords.max: the editors keep them
  back_matter:
    enabled: true
    delete_nil_statements: true  # "Funding: None" etc. go; the standard sections replace them
    add_missing: true            # required_sections not stated -> heading + default before references
    acknowledgement_heading: null  # e.g. Acknowledgements; editors keep the author's spelling
    patient_consent_query: false # case report without a consent statement (editors rarely query)

front_matter:  # title page: running head, type, title, authors, affiliations, correspondence, history
  enabled: true
  ai_split: true                 # Claude Haiku splits the title page into fields (needs the API key)
  title_case: sentence           # sentence | title | as_is (article title; the running head is always sentence case)
  capital_after_colon: true      # "dermoids: A comprehensive review"
  initial_period: true           # "Anjum S. K. Joad" (false: "Anjum S K Joad")
  abbreviate_middle_names: true  # guide and editors: "Anjum Syed Khan Joad" -> "Anjum S. K. Joad"
  affiliation_first_unnumbered: true  # "Asha Kumar, Ravi Rao1": the first affiliation has no number
  letters_at_end: true           # letters: author group to cite line after the letter, before the references
  correspondence_label: "Address for correspondence:"
  email_label: "E-mail:"
  pin_spaced: true               # Indian PIN after the city: "Chennai - 600 006"
  dates:
    labels: [Received, Revised, Accepted]
    keys: [received, revised, accepted]  # which XML dates, in order
    format: "%d-%m-%Y"           # 16-09-2026
    one_line: false              # true: one paragraph, tab-separated
    missing: "???"
  cite_label: "How to cite this article:"
  cite_journal: ""               # NLM abbreviation for the cite line; per journal below
  cite_max_authors: 6
  ltr_no_running_head_query: false
  # Per-journal settings (merged over the above by journal code), from the stylesheets and the editors' files.
  journals:
    ijo: {title_case: sentence, initial_period: false, correspondence_label: "Correspondence to:",
          dates: {labels: [Submitted, Revised, Accepted], format: "%d-%b-%Y", one_line: true},
          cite_label: "Cite this article as:", cite_journal: Indian J Ophthalmol,
          cite_journal_case_reports: Indian J Ophthalmol Case Rep, ltr_no_running_head_query: true}
    dshmj: {cite_journal: Dr Sulaiman Al Habib Med J}
    neurol: {title_case: title, cite_journal: Neurol India}
    joacc: {title_case: title, cite_journal: J Obstet Anaesth Crit Care}
    abr: {affiliation_first_unnumbered: false, title_case: title, cite_journal: Adv Biomed Res, dates: {labels: [Submitted, Revised, Accepted]}}
    aca: {title_case: title, cite_journal: Ann Card Anaesth}
    aian: {initial_period: false, title_case: title, cite_journal: Ann Indian Acad Neurol}
    aomd: {affiliation_first_unnumbered: false, cite_journal: Ann Mov Disord}
    crst: {cite_journal: Cancer Res Stat Treat}
    idoj: {affiliation_first_unnumbered: false, title_case: title, cite_journal: Indian Dermatol Online J}
    ija: {title_case: as_is, cite_journal: Indian J Anaesth}
    ijc: {cite_journal: Indian J Cancer, correspondence_label: "Correspondence to:"}
    ijcm: {cite_journal: Indian J Community Med}
    ijd: {title_case: title, cite_journal: Indian J Dermatol}
    ijdr: {affiliation_first_unnumbered: false, title_case: title, cite_journal: Indian J Dent Res}
    ijnmr: {title_case: title, cite_journal: Iran J Nurs Midwifery Res}
    ijpm: {cite_journal: Indian J Pathol Microbiol}
    ijpvm: {title_case: title, cite_journal: Int J Prev Med}
    indianjpsychiatry: {cite_journal: Indian J Psychiatry}
    ipj: {cite_journal: Ind Psychiatry J}
    jcrt: {cite_journal: J Cancer Res Ther}
    jdrntruhs: {cite_journal: J NTR Univ Health Sci}
    jehp: {cite_journal: J Educ Health Promot}
    jfmpc: {affiliation_first_unnumbered: false, cite_journal: J Family Med Prim Care}
    jomfp: {cite_journal: J Oral Maxillofac Pathol}
    jpgm: {cite_journal: J Postgrad Med}
    lungindia: {affiliation_first_unnumbered: false, cite_journal: Lung India}
    mjdrdypu: {cite_journal: Med J DY Patil Univ}
    njcp: {title_case: title, cite_journal: Niger J Clin Pract}
    njms: {cite_journal: Natl J Maxillofac Surg}
    sja: {cite_journal: Saudi J Anaesth}
    sjg: {affiliation_first_unnumbered: false, cite_journal: Saudi J Gastroenterol}
    smj: {cite_journal: Singapore Med J, correspondence_label: "Correspondence:", capital_after_colon: false,
          dates: {labels: [Received, Accepted], keys: [received, accepted], format: "%d %b %Y", one_line: true}}
    wjcs: {cite_journal: World J Colorectal Surg}

copyedit:
  spelling:
    enabled: true
    convention: american       # british | american | follow_author | none (most Medknow journals: American)
    british_z: false           # british with Oxford -ize instead of -ise
    max_level: 70              # VarCon/SCOWL word level; rarer clusters hold odd forms ("colourectal")
    journals: {}               # journal code -> convention; prefer copyedit.spelling.convention in styles/<journal>.yaml
    skip: [acknowledgement, acknowledgements]  # never converted (guide: "Acknowledgement" heading in UK spelling)
  abbreviations:
    enabled: true
    query_undefined: true      # "ABBR: Kindly expand the abbreviation."
    query_before_definition: true
    move_definition: false     # instead of a query, move the expansion to the first use
    redefinition: query        # full form (ABBR) again in one scope: query | change (-> "ABBR") | off
    allow: []                  # extra abbreviations that need no expansion
  languagetool:
    enabled: true              # skipped when no server answers (python -m edit_os.copyedit languagetool start)
    language: null             # en-GB / en-US; default follows the spelling convention
    level: picky               # LanguageTool's rule level; picky enables UNIT_SPACE
    rules:                     # rule IDs whose single suggestion becomes a change (tuned with tools/eval_ce.py)
      - HYPHEN_TO_EN           # 18-81 years -> 18–81 years
      - UNIT_SPACE             # 10mg -> 10 mg (picky level)
      - CONSECUTIVE_SPACES     # never next to symbol-font characters (± often sits between two spaces)
      - DASH_RULE
      - COMMA_PARENTHESIS_WHITESPACE  # "word ," -> "word,"
      - SPACE_BEFORE_PARENTHESIS
      - CA_FOLLOW_UP           # follow up (noun) -> follow-up
      - YEAR_OLD_HYPHEN        # 45 year old -> 45-year-old
      - DECISION_MAKING
      - FROM_X_Y
      - BETWEEN_TO_AND         # between 5 to 10 -> between 5 and 10
      - SENT_START_CONJUNCTIVE_LINKING_ADVERB_COMMA  # "However the" -> "However, the"
      - ALL_OF_THE
      - EN_COMPOUNDS_FOLLOW_UPS
      - EN_COMPOUNDS_LONG_STANDING
      - EN_COMPOUNDS_SHORT_LIVED
    categories: []
    disabled_rules: []
    warn_categories: []        # other matches in these categories go to the editor as warnings
  claude:                      # B4: Claude copy-edit pass (edit_os/copyedit/claude_pass.py); off without EDITOS_ANTHROPIC_API_KEY
    enabled: true
    model: claude-haiku-5-5    # EDITOS_CE_MODEL (else EDITOS_MODEL) overrides. 16 held-out articles: Haiku 70% precision,
                               # $0.0025/article; Sonnet 5.5 61%, $0.026; Opus 5.5 65%, $0.063 (tools/eval_ce.py)
    effort: medium             # EDITOS_CE_EFFORT overrides; medium beat low on Haiku (precision 70.1% vs 67.2%, 26% more edits)
    chunk_words: 1500          # paragraphs per request, up to about this many words
    examples: 40               # few-shot copy-editor edits (training articles only), same journal first
    examples_path: null        # private changes.jsonl of past edits (or EDITOS_CE_EXAMPLES); never committed
    max_words: 6               # longest edit (words in old, after trimming to what changes)
    max_chars: 60
    max_queries_per_chunk: 1   # copy editors query rarely; only real ambiguity
    min_confidence: certain    # certain | likely: keep only edits Claude marks certain
    skip_kinds: []             # e.g. [word_choice] to turn a kind of suggestion off
    close_prefixes: false      # close up prefixed compounds (postoperative); on where the journal's copy editors do

autopilot:  # "Autopilot" on the review screen (edit_os/autopilot.py): accepts pending suggestions it is sure of
  accept_sources: [rule]       # rules, verified references, NLM abbreviations, spelling, LanguageTool, front matter
  hold: []                     # reasons always left for the editor, e.g. [renumber, front_matter, guide.multiplication]
  ai_judge: true               # Claude's copy edits: accepted only when a second Claude check agrees; else left
  model: claude-haiku-5-5      # EDITOS_AUTOPILOT_MODEL overrides
