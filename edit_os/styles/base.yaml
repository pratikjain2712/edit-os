# Shared Wolters Kluwer - Medknow style. Journal files override any key.
# Source of truth (CLAUDE.md): the journal's stylesheet, then the pre-editing guide (G<line>: preedit guide.txt) where
# the stylesheet is silent; editors' habits only where both are silent. The values here follow the rules that the
# stylesheets share (S: the common template line, in 26-41 of the 42 sheets) and the guide; each styles/<journal>.yaml
# overrides what its own sheet says differently. A journal with no stylesheet (e.g. AOMD) gets these values.
name: Base (Medknow)

citations:
  brackets: square          # (4) -> [4]
  after_punctuation: true   # "region (4)." -> "region.[4]"
  multiple_delimiter: ","   # [1,2,4], no space
  range_dash: "-"           # [6–9] -> [6-9]
  two_number_range_as_list: true  # [1-2] -> [1,2]
  next_to_author: true      # "Liu et al. found ... (P = 0.02).[17]" -> "Liu et al.[17] found ...": one citation
                            # closing the passage that names one study, its reference's first author that name
  next_to_author_max_sentences: 4  # at most 3 sentence breaks between the name and the citation
  author_match_query: true  # "Surname et al. [n]" naming another first author than reference n -> query (S, 41 of 42
                            # sheets: "Match author names in the references list with those in citations"; guide E.g. 6)
  compress_from: null       # 3: runs of 3+ numbers in any citation as a range, "[3,4,5]" -> "[3-5]" (renumbered
                            # citations always: renumber.compress_from)
  author_year: false         # "Surname et al. (2015) [7]" -> "Surname et al.[7]"; "Surname et al. (2015)" -> "Surname
                            # et al.[7]" when the numbered list has exactly one entry by that first author in that year

headings:
  tag: true  # prefix headings with <H1> / <H2> for typesetting
  h1: [abstract, introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references,
       case report, case reports, case presentation, review of literature]
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, acknowledgment, acknowledgments, acknowledgement,
       acknowledgements, author contribution statement, author contributions, data availability statement,
       ethical approval, ethics approval]
  strip_trailing_colon: false  # G137: "If punctuation (period, comma, hyphen, ndash, colon, etc.) is present at end of
                              # heading then please retain as it is" (editors drop the colon: owner's list)
  subheadings: true          # short own-line heads inside a section -> <H2> (<H3> for italic under bold, "2.1.1")
  subheading_max_words: 8
  subheading_plain_min_next: 200  # a plain (not bold / italic) head needs running text this long after it
  back_matter_subheadings: false  # after the Conclusion: a short bold (or Word heading style) line over a statement
                                  # ("Data availability", "Consent for publication") -> <H2>
  sentence_case_brackets: false  # sentence case also in brackets whose words the text writes in lower case:
                                 # "(In Vitro)" -> "(in vitro)" ("(Index Case)" kept: IJO editors)
  duplicate_query: true  # a heading given twice in a row (own line, or a run-in label split off as a heading) -> query
  nested_subheadings: false  # a head over another head is its parent (<H2> over <H3>), heads over a caption, bold run-in
                             # methods labels split off, Word heading styles giving the level (per journal: JEHP)
  case_report_methods_sections: false  # in a case report, the first own-line head under "Methods" that is not a case
                                       # ("Literature Search Strategy") is a first-level section of its own (IJO)
  sentence_case_hyphen_parts: false  # sentence case also after a hyphen: "Long-Term Follow-Up" -> "Long-term follow-up"
  subheading_case: sentence  # keep | sentence: <H2> / <H3> heads "Statistical Analysis" -> "Statistical analysis"
                             # (S: "H2 | Sentence Case, Bold" / "H3 | Sentence Case", all 41 sheets)

statistics:
  space_around_operators: true  # p=0.03 -> p = 0.03
  unary_after_word: false       # true: also "aged ≥18" -> "aged ≥ 18" (< > ≤ ≥ after a plain word). Off: a sign with
                                # no left operand is unary (G301: "><space>10 -> >10", delete the space)

guide_replace:  # the pre-editing guide's search-and-replace table (edit_os/rules_guide.py), body text only
  # On: the guide's table (G289-330; the stylesheets are silent on these). Off: not in the guide.
  et_al_period: true          # "Smith et al reported" -> "Smith et al. reported"
  ampersand: true             # "anxiety & depression" -> "anxiety and depression" (not references, not "Jammu & Kashmir")
  operator_spacing: true      # "5.2±1.3" -> "5.2 ± 1.3"; off when statistics.space_around_operators is off, unless "always"
  operators: "+±"
  percent_space: true         # "50 %" -> "50%"
  value_unit_space: true      # "123mg" -> "123 mg"
  units: [μg, µg, μs, µs, Hertz, μL, µL, μl, µl, mm, cm, km, mg, rpm, nm,
          mmHg, nJ, μJ, µJ, mJ, gm]  # the last six: not in the guide's table, same rule (IJO editors: "50 mmHg", "20 nJ")
  bracket_inner_space: true   # "( 80 )" -> "(80)"
  double_period: true         # "80.." -> "80."
  multiplication: true        # "10x20" -> "10 × 20"
  # The next six are in the guide but editors mostly leave them (measurement in rules_guide.py): applied per the
  # guide; editor misses, not tool errors (owner list: audit conflicts).
  nbsp: true                  # non-breaking space -> space (G298)
  unary_minus: true           # "of -1.53" -> "of −1.53" (G300)
  unary_comparison: true      # "(> 250 μm)" -> "(>250 μm)" (G301)
  value_bracket_space: true   # "20(80)" -> "20 (80)" (G311)
  degree_space: true          # "29 °C" -> "29°C" (G314)
  technetium: true            # "99 mTc" -> "99mTc" (G321)
  p_value_capital: true       # "p = 0.03" -> "P = 0.03" (G294: "Probability should be changed to capital case")
  comparison_symbol: true     # ">=30 min" -> "≥30 min", "<=" -> "≤" (G319)
  range_dash: false           # numeric ranges "2-6 years", "(1.01-1.06)" -> en dash (not citations, dates, IL-6)
  trailing_space: true        # spaces at the end of a paragraph go (G143: "Space(s) present at beginning and at end
  leading_space: true         # should be deleted"); at the start too (tabs stay)
  double_space: false         # "and  control" -> "and control"
  smart_quotes: false         # "caregivers' knowledge" -> "caregivers’ knowledge", "safe" -> “safe”
  abbreviation_colon: false   # "Abbreviations: CI, confidence interval; OR, odds ratio" -> "CI: confidence interval; ..."
  include_tables: false
  table_rules: []             # finders that also run in tables when include_tables is off, e.g. [range_dash]

text:  # copy-edit text rules (edit_os/rules_text.py), run with the copy-edit checkers; body text, not references
  # Measured on 158 articles against the copy editors' text (tools/eval_ce.py; proposed, precision): the style
  # editors make none of these edits in running text. Off unless the journal's copy editors do it.
  enabled: true
  include_tables: false
  ranges: {enabled: true}          # "between 61–70 years" -> "between 61 and 70", "from 18-81" -> "from 18 to 81"
                                   # (27, 78%; IJO 6 of 6)
  prefixes:                        # "non-invasive" -> "noninvasive", "post operatively" -> "postoperatively",
    enabled: false                 # "intraarterial" -> "intra-arterial"; hyphen kept before capitals, numbers,
    spaced: true                   # the same vowel, -ly adverbs and (post-, pre-) nouns. All journals 441, 55%;
    same_vowel_hyphen: true        # IJO 98, 93%. Keep consistent with copyedit.claude.close_prefixes.
  number_words: {enabled: false}   # "three months" -> "3 months" (time units; not at a sentence start). All 233,
                                   # 52%; IJO 61, 77%; Indian J Psychiatry 21, 95%; IDOJ 12, 100%; ABR 22, 5%
  stat_semicolons: {enabled: false}  # "(p = 0.065), at 3 months ... (p = 0.165)" -> "(p = 0.065); at 3 months":
                                     # IJO 2 of 2; rare (25 comma -> semicolon edits in the corpus, most not stats)
  lowercase:                       # "Retinal Detachment", "Computed Tomography (CT)" mid-sentence -> lower case.
    enabled: false                 # Off: editors keep capitals as often as they lower them (483, 33%;
    expansions: true               # IJO 56, 46%; full forms before an abbreviation 126, 24%)
    running_text: true
    min_lower: 2                   # a single capitalised word: the author writes it in lower case this often

references:
  lookup: true                 # rebuild entries from PubMed / CrossRef when they match strictly
  style_unverified: true       # an entry PubMed / CrossRef cannot verify is still styled, from the author's own
                               # fields (refstyle.py; owner: "If verification is not possible we have to style it as
                               # per the guide"); nothing the author did not write is added, missing fields queried
  ai_parse: true               # Claude splits entries into fields first (needs ANTHROPIC_API_KEY)
  max_authors: 6               # more than 6 -> first 6, et al.
  et_al: "et al."
  initials_without_periods: true  # "Lindqvist P.," -> "Lindqvist P,"
  max_initials: null           # 2: "Chandrasena PPCM" -> "Chandrasena PP" (per journal: JEHP)
  clear_formatting: false     # italic and bold taken off the entries (EndNote / APA titles, journals, volumes); et al.,
                               # genus and species and in vivo stay (per journal)
  page_range_compress: true    # 101-109 -> 101-9
  label_period: false          # typed labels as "1. ": "1.Angus DC" -> "1. Angus DC", "1)" -> "1." (per journal)
  label_auto_number: false     # typed labels removed, the entries numbered by Word instead: "1.<tab>Angus DC" ->
                               # "Angus DC" as item 1 of an automatic "1." list (per journal; wins over label_period)
  title_search: true           # nothing found by first author: a title-only search, accepted only with the whole
                               # title, year, journal and the first author in the record's list (or a long title
                               # with the entry's volume and first page); an entry with no journal ("... study. 2024")
                               # is completed only from its first author's paper (refengine.find_by_title)
  page_range_dash: "-"
  drop_issue: true             # 2017;12(3):101-9 -> 2017;12:101-9
  no_period_before_year: true  # J Med Genet. 1987;24 -> J Med Genet 1987;24
  capitalize_after_colon: true # "dermoid: a case report" -> "dermoid: A case report"
  title_sentence_case: true    # "Treatment of Metastatic Cancer" -> "Treatment of metastatic cancer"
  journal_abbreviation: nlm    # Index Medicus abbreviation from NLM's journal list
  non_indexed_journal: full    # a journal NLM does not list: CrossRef's full title, not its short one ("ITSE");
                               # S (41 of 42 sheets): "Use complete name of the journal for non-indexed journals"
  journal_drop_qualifier: false  # true: "Spine (Phila Pa 1976)" -> "Spine". Off: S "The titles of journals should be
                                 # abbreviated according to the style used in Index Medicus" (NLM's title keeps it)
  other:                       # books, links, conference papers, reports, theses (refs_other.py)
    enabled: true              # template fixes: "Available from: URL. [Last accessed on 2010 Jul 10].", "4th ed."
    check_links: true          # open each URL: dead links, soft 404s and redirects become queries
    verify_books: true         # look books up in CrossRef and Open Library
    query_unverified: true     # conference papers, reports, theses: query that they could not be verified

keywords:
  min: 3
  max: 5
  alphabetical: true

required_sections:  # in the order the style editors add them before the references
  # keep_labels: [...] in an entry: the author's heading in this list is kept as written (tagged, not renamed)
  - {heading: Financial support and sponsorship, default: "Nil."}
  - {heading: Conflicts of interest, default: "There are no conflicts of interest."}
expected_h1: [conclusion]

formatting:  # run formatting from the pre-editing guide, rendered as tracked formatting
  enabled: true
  et_al_italic: true           # body "et al." in italics
  et_al_italic_references: false  # ... and in the reference list. The guide's search-and-replace row 1 ("et al" ->
                               # "et al.", italics) excludes nothing (only row 4, "&", spares references), but the
                               # other sheets are silent and AIAN says "not required to be in italics": per journal
  et_al_period: true           # "et al" -> "et al."
  latin_italic: true           # in vivo, in vitro, in situ, ex vivo
  p_values: true               # probability P in italics (G294 "capital case with italics style"; editors: 0 of 532
                               # in 160 articles -- an editor miss, on the owner's list)
  p_capital: true              # "p < 0.05" -> "P < 0.05" (G294)
  n_variable_italic: true      # "n = 34": italic n (G296; editors 0 of 242, on the owner's list)
  superscript_citations: true  # body citations [4] in superscript
  # Clean-up of the author's run formatting (rules_format.rule_cleanup), from the style editors'
  # tracked formatting (tools/eval_format.py):
  remove_font_color: true      # the author's font colours (blue, red, ...) back to automatic, URLs aside
  table_head_bold: true        # table column heads (header row) in bold
  table_body_unbold: false     # no bold in the table body (rows under the header): editors keep it (4% precision)
  label_bold: true             # "Table 1:", "Figure 1:", "Video 1:" and bold_labels ("Keywords:") in bold
  table_caption_bold: false    # true: the whole table caption in bold, label and text (G199 '"Table<space>#:<space>"
                               # followed by caption content in bold style'), also in a table's caption row
  bold_labels: [Keywords, Key words, Key word, Key messages, Key message]
  heading_bold: true           # first-level section headings (Introduction, Methods, ...) in bold
  heading_bold_tagged: false   # every heading the tool tags <H1> / <H2> / <H3> (a line of its own) in bold
  heading_bold_levels: [1, 2, 3]  # ... at these levels
  heading_no_underline: true   # no underline in headings
  body_unbold: true            # stray bold inside running text (labels and run-in headings stay)
  heading_italic_levels: []    # tagged headings at these levels in italics (IJO S: "H3 | Sentence Case, Italics")
  heading_roman_levels: []     # tagged headings at these levels not italic (S: "H1 | ... Bold, Roman")
  heading_unbold_levels: []    # tagged headings at these levels not bold (IJO H3: owner, 2026-10-26)
  # Font family, size and alignment of every run and paragraph (rules_format.rule_fonts), and of the paragraphs
  # the tool inserts (front matter, header lines, legends heading, "Figure N: ???"). The guide is common to all
  # journals: paragraphs, author group, affiliations, correspondence, abstract text, tables, figure labels 12 pt
  # (G16-G142, G193, G260); article type, title, abstract heading, H1, Acknowledgement heading 14 pt bold (G32, G37,
  # G110, G133, G146); "left aligned" throughout, the running head "center aligned" (G16). Off here until the owner
  # confirms it for every journal (the editors of IJO, JEHP and MJDRDYPU set the whole file in Times New Roman
  # 12 pt and never 14 pt: owner's list); on per journal.
  fonts:
    enabled: false
    family: null               # the guide names no font: the journal's editors' (IJO, JEHP: Times New Roman)
    size: 12
    heading_size: 14
    align: null                # left: paragraphs left aligned (not table cells, pictures or equations)
    table_align: null          # left: table cell paragraphs left aligned too (G193-194 "aligned left. No other alignment
                               # should be done"); null: cells keep the alignment they were typed with
    running_head_align: center
  symbol_font:                 # Greek letters, ±, ≤, ≥ and the minus sign as Word's Symbol-font symbols (<w:sym>),
    enabled: false             # never ×, ®, ©, µ (owner, 2026-10-26: IJO, JEHP)

figures:                        # figure and table citations and captions (rules_figures.py)
  citations: true
  brackets: square              # (Figure 1) -> [Figure 1]
  before_full_stop: false       # "immunized. (Table 1)" -> "immunized [Table 1]." (square brackets only)
  bracket_lead_words: null      # "(see Figure 1)": drop -> "[Figure 1]", keep -> "[see Figure 1]", null: left as typed
  split_mixed_brackets: false   # true: "(P = 0.21; Table 2)" -> "(P = 0.21) [Table 2]" (per journal: JEHP S260)
  stray_citations: null         # " (Table 3)." alone on a line under a paragraph: join (-> "... the groups [Table 3].") |
                                # query | null (only its brackets fixed)
  unbold_citations: false       # true: bold figure / table citations in running text -> roman
  figure_label: Figure          # "Fig. 1" -> "Figure 1" (G240; IJO's sheet says "Fig. 1")
  lowercase_labels: false       # true: body citations written "table 2" / "figure 1" -> "Table 2" / "Figure 1"
  figure_label_plural: Figures
  part_labels: upper            # body citations: Figure 1a -> Figure 1A (G245 "Figure part labels should be in uppercase";
                                # editors write lower case: owner's list)
  legend_part_case: lower       # legends: "(A)" -> "(a)" (G263 "part labels ... in small case enclosed within round brackets")
  part_case_query: false
  legend_part_labels: true      # in legends "(1A)" / "(A, B)" / "a)" -> "(a)" / "(a, b)" in part_labels case (IJO, JCRT, NI editors)
  range_dash: "–"               # "Tables 1 to 3" -> "Tables 1–3"
  compress_lists: true          # "Tables 1, 2 and 3" -> "Tables 1–3" (S: "Table citation | Tables 1–6; Table 1; Tables 2 and 3")
  captions: true
  caption_separator: ": "       # "Table 1. Title" -> "Table 1: Title"
  caption_end_period: false     # delete the period at the end of a caption
  caption_end_period_keep: false  # true: leave the caption's final period as the author typed it
  table_caption_end_period: add   # add | delete | keep; null: as caption_end_period. S (26 sheets): "The caption should
                                  # end with a period" (table captions); journals without that line: delete (G200)
  figure_caption_end_period: null # add | delete | keep; null: as above (delete: G261 "The period if present at end of
                                  # caption should be deleted"; the stylesheets are silent but SGMJ)
  graph_caption_end_period: null  # add | delete | keep for "Graph N:" captions; null: as above
  table_footnote_end_period: null  # delete: the period ending a table's last footnote goes ("SD, standard deviation.")
  table_caption_case: null      # sentence: "Table 1: Baseline Characteristics" -> "Table 1: Baseline characteristics"
                                # (S: 'followed by caption content in bold style and Sentence Case'); null: as typed
  table_footnote_order: null    # abbreviations_first: an abbreviation-list paragraph under the other notes of its table
                                # moves above them (G214 "Abbreviations should be first and footnotes next")
  table_footnote_delimiter: null  # ",": "CDVA = ...; SD = ..." -> "CDVA = ..., SD = ..." between abbreviation
                                  # definitions in table notes (S: "Comma should be delimiter between abbreviations")
  table_heads_title_case: false # column heads in ALL CAPS -> Title Case (S / G205 "In case the content is in All Caps
                                # then please make it as Title Case"); words the text writes in capitals stay
  table_heads_case: null        # sentence: Title Case column heads -> sentence case ("Study Design" -> "Study design");
                                # words the running text capitalises mid-sentence (names) and acronyms stay
  table_footnote_abbreviation: null  # " = ": table-note pairs "SD, standard deviation" / "SD: standard deviation" ->
                                     # "SD = standard deviation" (S: 'term<space>=<space>definition'); ": " the other
                                     # way ("term: definition"); null: as typed
  table_caption_notes: null     # split: a note typed after a table caption's first sentence ("... (N=100). IQR,
                                # interquartile range") goes under the table as its footnote
  figure_caption_case: null     # sentence: figure legend text in sentence case, first word capitalised
  tables_to_end: false          # true: captioned tables in the body move to the end, after the figure legends (G195
                                # "at end of document after figure captions"), under `tables_heading` (legends.py)
  tables_heading: null          # the heading over the tables at the end ("Tables"); null: none added
  query_no_captions: false      # true: figures cited but no legend in the file at all -> one query (G244)
  query_uncaptioned_images: false  # true: a picture in the body with no caption beside it -> query (G244; JEHP)
  query_equation_images: false  # true: a display equation given as a picture -> the sheet's query (JEHP S292)
  table_footnote_queries: false  # true: table abbreviations the footnote does not expand, a footnote symbol given two
                                 # meanings or none -> queries (JEHP: "Abbreviations should be first ...")
  legend_run_on: false          # true: a legend's parts typed as separate paragraphs ("Fig.1 A ...", "Fig.1 B ...",
                                # "(C) ...", "b. ...") run on into one legend (G264); false: each part keeps its line,
                                # the repeated label replaced by "(b) "
  legends_to_end: false         # true: legends in the body (or after the tables) move after the references, before
                                # the tables (G265, G195), under `legends_heading` (legends.py); one move suggestion
  legends_heading: null         # the heading over the legends ("Figure Legends"); an author's "Legends:" /
                                # "Legends to Figures" / "Image description" is renamed to it; null: as typed
  legends_heading_single: null  # the heading when there is one figure ("Figure Legend"); null: legends_heading
  table_caption_row: false      # true: a table caption next to its table goes into a merged first row (legends.py)
  queries: true                 # out of order, cited without caption, caption never cited
  renumber: true                # tables / figures first cited out of order -> renumbered in citations and captions and put
                                # in the new order (rules_figures.renumber_plan, header.move_blocks). S (every sheet but
                                # KJO): "All the reference, figure and table citations are to be cited ... in chronological
                                # order". Editors: 8 of 16 such articles renumbered, 8 queried (owner's list); only when
                                # safe (each cited number has one caption, all cited), else the guide's query (G8)
  insert:                       # figures sent as separate files in the zip -> picture above its legend (figures_insert.py)
    enabled: true               # S (41 of 42 sheets) and G266: "Image should be present first and below it the respective
                                # caption"; KJO's sheet is silent, so the guide applies. Editors often skip it (13 of 57
                                # articles with separate figure files; MJDRDYPU 5 of 8): an editor miss (CLAUDE.md)
    without_legend: true        # a figure file with no legend in the manuscript: picture + "Figure N: ???" + query,
                                # before the end tables (G195) or at the end (as editors do, e.g. MJDRDYPU 831)
    position: above             # above the legend (stylesheets: "Image should be present first and below it the
                                # respective caption"); below: under it
    max_height: 0.85            # share of the page's text height a picture may take (width: the text width)
    parts_per_row: 2            # "1a.jpg" + "1b.jpg": one paragraph, side by side
    max_pixels: 2400            # longer side above this is downscaled (keeps the .docx small); 0 = never
    align: center

tables:  # table body layout (edit_os/rules_tables.py); the guide's TABLE section, G193-G209
  indent:                       # G208: "clear/more indentation ... removed and 5 spaces (and increment of 5 spaces) added
    enabled: false              # in its place" (the stub column: leading spaces / tabs and paragraph indentation as
    spaces: 5                   # levels); G209: rows under a sub-heading row indented (a stub the author did not indent)
    subheading_rows: true
  delete_empty_cell_paragraphs: false  # G196: empty paragraphs inside a cell with text deleted (one move suggestion)
  empty_head_query: false       # G206: empty column-head cells side by side -> query to merge them horizontally (Word
                                # tracks no cell merge)
  cell_rows_query: false        # G196: a row whose cells hold their entries as separate paragraphs -> query whether they
                                # are separate rows (a value with its range on a second line is one row)

queries:  # author queries on the text (edit_os/queries.py)
  unmatched_brackets: false  # true: a stray bracket ("(−1.20,3.40))") -> query (JEHP)

header:  # top of the tracked and clean copies (edit_os/header.py); measured on the 236 style editors' files
  enabled: true
  signoff:
    enabled: true
    # G286 "Please add signature as follows: Technical Editing done on <date>:- <name>. E.g.: Technical Editing done
    # on 08-March-2012:- Vikram S." (all 236 editor files sign off; they write the date many ways and the name in 5)
    technical_editing: "Technical Editing done on {date}:- {name}"
    date_format: "%d-%B-%Y"
    copyediting: "Copyediting done on {date}"  # when the copy-edit stage ran; the guide is silent: the copy editors'
    copyediting_date_format: "%d-%m-%y"         # wording and their most common date form (44 of 154 files)
    timezone: Asia/Kolkata
    placeholder: "???"           # no editor known: QC (signoff.name) blocks delivery until the name is in
  query_label: null              # "AQ: " / "Query: "; null: submission.copyright_notice_prefix
  renumber:                      # query + old -> new table when references / tables / figures are renumbered
    enabled: true                # (editors: 37 of 236 files; the queries leave the comments for the header)
    references: "References are renumbered in text and list for citation sequence"  # editors' most common (9 of 26)
    references_duplicates: "References {pairs} are identical, so duplicate reference has been removed and references
      are renumbered in text and list"
    tables: "Table citations are not in sequential order. Therefore, the Tables and citations have been renumbered.
      Please check and confirm."  # the editors' only header wording for tables (MJDRDYPU)
    figures: "Figure citations are not in sequential order. Therefore, the figure captions and citations have been
      renumbered. Please check and confirm."
    columns: {references: [Old, New], tables: [Old, New], figures: [Old, New]}  # "Old | New": 30 of 37 tables
  editor_queries:                # added by one style editor in all her files (18 of 236), in no stylesheet: off
    names_affiliations: false    # MJDRDYPU 9 of 29, IJNMR 3 of 6, JEHP 4 of 33, JOMFP 1 of 5, SJA 1 of 6
    heading_levels: false        # MJDRDYPU 10 of 29, IJNMR 3 of 6, JEHP 6 of 33, JOMFP 1 of 5
  texts:
    names_affiliations: "Please ensure that the author names and affiliations are treated correctly. Kindly check
      and correct if necessary."
    heading_levels: "Please ensure that the section heading levels are treated correctly. Kindly check and correct if
      necessary."

renumber:                       # duplicate references and citation-order renumbering (renumber.py)
  enabled: true
  remove_duplicates: true       # guide E.g. 3
  reorder: true                 # guide E.g. 4; never when a reference is uncited (E.g. 5)
  compress_from: 3              # renumbered [4,5,6] -> [4-6]; two numbers stay a list

sections:  # headings, abstract, key words, back matter (edit_os/rules_sections.py)
  enabled: true
  headings:
    strip_numbering: true      # "1. Introduction" -> "Introduction" (recognised headings only)
    title_minor_words: true    # "Materials And Methods" -> "Materials and Methods"
    case: title                # H1 text case: keep | upper | title | sentence (S: "H1 | Title case, Bold"; G133 Title Case;
                               # caps journals: upper)
    rename: {methods: Materials and Methods, method: Materials and Methods, methodology: Materials and Methods}
                               # G138: "METHODS" / "METHOD" / "METHODOLOGY" -> "Materials and Methods" (the sheets are
                               # silent but IJO, IJNMR, IJA, SGMJ: "Methods"); editors keep "Methods": owner's list
    drop: []                   # headings the journal does not print, e.g. [introduction]
    reference_heading: null    # e.g. References: the reference list's heading "Reference" / "Bibliography" -> it
    strip_sub_numbering: false  # "3.2 Association ..." -> "Association ..." on the sub-headings the tool tags <H2> / <H3>
    bold: false                # bold recognised headings (most are bold already)
  abstract:
    heading: Abstract
    add_heading: true            # insert "Abstract" before an abstract that has none
    split_inline_heading: true   # "Abstract: text" -> heading paragraph + text
    strip_heading_colon: true    # "Abstract:" -> "Abstract"
    heading_case: false          # "ABSTRACT" (typed, or the all-caps attribute) -> `heading` (per journal: IJO)
    heading_bold: false          # the heading split off an inline "ABSTRACT: text" in bold (per journal: IJO)
    unbold_text: false           # bold words in the abstract's text go roman (sub-heading labels stay; IJO sheet)
    subheading_colon: true       # "Purpose:To" -> "Purpose: To"; "Methods" on its own line -> "Methods: "
    subheading_case: title       # keep | title | upper (S: "Headings in a structured abstract should be in Title case and
    subheading_bold: true        # bold followed by a colon", 41 sheets; the guide's caps lose to them)
    rename: {materials and methods: Methods, material and methods: Methods, materials and method: Methods,
             methods and materials: Methods, methods and material: Methods, methodology: Methods}  # S (36 sheets): 'The sub-headings “Materials and Methods” or “Methodology” should be
                                    # changed to “Methods”'
    citation_query: true         # citations in the abstract -> author query
    word_limit_query: true       # S (33 sheets): "If the abstract exceeds these word limits, raise query" (editors
                                 # seldom do: owner's list)
    word_limit: {structured: 250, unstructured: 150}
    structured_case_report_query: true  # editors' query: case reports have no structured abstract
  keywords:
    heading: "Keywords:"         # every stylesheet; the generic guide says "Key words:"
    fix_heading: true
    delimiter: ", "
    sort: true                   # with keywords.alphabetical
    case: true                   # first keyword capitalised, others lower case unless proper nouns
    drop_final_period: true
    dedupe: true
    add_missing: true            # add the "Keywords:" line after the abstract and query
    max_query: true              # S (41 sheets): "minimum three keywords and a maximum of five keywords" -> query
    after_abstract: false        # key words above the abstract move under it (per journal: IJO sheet)
    label_bold: false            # "Keywords:" in bold, also when added (per journal: IJO S176)
    run_on: false                # "Keywords:" on a line of its own, the list below: the list runs on after the label
    from_xml: false              # no key words in the manuscript: the submission XML's <keywords> instead of a query
  letter_salutation: null       # letters: "Sir," / "Dear Sir/Madam," -> this (e.g. "Dear Editor,"); null: as typed (G: silent)
  back_matter:  # measured on the editors' tracked files (160 articles, 34 journals)
    enabled: true
    delete_nil_statements: true  # "Funding: None", "Conflict(s) of Interest and Disclosure(s): None", "No conflict
                                 # of interest." etc. go; the standard sections replace them
    reword_nil: true             # under the standard heading, "The authors declare no conflict of interest." ->
                                 # the required section's default wording ("None" -> "Nil." regardless)
    add_missing: true            # required_sections not stated -> heading + default before references
    split_run_in: false          # "Acknowledgement: The authors ...", several statements run on in one paragraph -> a
                                 # heading and its statement each (per journal: JEHP)
    data_heading: null           # with split_run_in: the heading a "Data availability:" label takes (null: as written)
    delete_declarations_heading: true  # a bare "Declarations" / "Statements and declarations" heading over the
                                       # statements goes (editors: 13 of 14)
    delete_nil_ethics: true      # "Ethics: Not required ...", "Consent for publication: Not applicable" go (7 of 7
                                 # inline ones; a heading with "Not applicable" under it is kept: ABR)
    nil_ethics_bare_only: false  # with delete_nil_ethics: only a bare "Not applicable." goes, inline or on the line under
                                 # its heading (with the heading); one giving a reason stays (per journal: JEHP)
    acknowledgement_heading: singular  # S (41 sheets): 'If heading "Acknowledgements" is present, then please delete
                                       # "s"' (singular: drop the final s; a string: that heading; null: as typed).
                                       # Editors changed 0 of 17: owner's list
    acknowledgement_from_sources: false  # an acknowledgement given only on the title page is added before the
                                         # financial support (per journal: IJO S382 "Retain if given")
    supplementary_heading: null  # G151: supporting information retained as it is; the 19 sheets that ask for the
                                 # “Supplementary Material” heading set it (no editor added it: 0 of 6 articles)
    patient_consent_query: true  # case report with no consent statement anywhere: "Kindly confirm whether consent
                                 # form obtained or not?" (the pre-editing query in all 8 such case reports)
    order: [consent, contributions, funding, conflict]  # where added sections go among those already there
    heading_bold: false          # the section headings added, renamed or split off in bold (per journal: IJO H2)
    consent:  # "Declaration of patient consent" (every stylesheet but JOS, KJO, IJNMR, JDRNTRUHS)
      enabled: true
      heading: Declaration of patient consent
      head_unlabelled: true      # an author's consent statement with no heading gets the heading; an inline
                                 # "Patient Consent: Written ..." becomes heading + statement
      rename_heading: false      # the author's own consent heading -> `heading` (AIAN); IJO editors keep it as written
      move: false                # a consent section after the references / legends or after the funding and conflicts
                                 # statements moves before them (per journal: IJO S392)
      add_missing: true          # no consent statement and identifiable patient images (an image article, or a case
                                 # report / letter whose legends show clinical photographs): heading + standard text
      query: true                # ... and the stylesheet's query "Please ensure that patient consent form has been obtained."
      text: >-
        The authors certify that they have obtained all appropriate patient consent forms. In the form the
        patient(s) has/have given his/her/their consent for his/her/their images and other clinical information
        to be reported in the journal. The patients understand that their names and initials will not be
        published and due efforts will be made to conceal their identity, but anonymity cannot be guaranteed.
    contributions:  # authors' contributions
      enabled: true
      heading: Author contributions
      split_inline: true         # "Author contributions: US: data ..." -> heading + statement
      head_unlabelled: true      # "Dr A – Concept, design ..." lines with no heading get the heading
      from_sources: false        # add the section from the title page / contribution form / cover letter when the
                                 # manuscript has none (per journal: IJO and IDOJ editors do; ABR editors never do)
      query_missing: false       # none given anywhere (IJO editors queried 1 of 7 such articles)
      move_from_top: false       # statements on the manuscript's own title page ("Fatma Savur: Data acquisition, ...")
                                 # are deleted there and inserted under the heading at the back (per journal: IJO)
    first_author:  # "First author:" (bold), the first author's full name (bold) and affiliation, after the
                   # references and before the figure legends (edit_os/first_author.py); per journal
      enabled: false
      label: "First author:"
      name_bold: true
      skip_types: []             # article types (as printed, whole) that get no block
    data_availability:  # "Data availability statement" (MJDRDYPU stylesheet: add it if given in source or FP, else query)
      enabled: false             # an existing statement is kept as written (and places the sections added around it)
      heading: Data availability statement
      from_sources: true         # the statement on the title page (first-page file) when the manuscript has none
      query_missing: false       # "Please provide the missing Data availability statement, if available."

submission:  # parts of a submission inside the manuscript file (edit_os/submission.py); measured on the editors' files
  enabled: true
  copyright_notice_aq: true    # the portal's "The author(s) ... has/have not agreed to the copyright terms ..." on top:
                               # editors prefix "AQ: " (46 of 48; 2 left it)
  copyright_notice_prefix: "AQ: "
  delete_cover_letter: true    # "Cover letter" / "To, The Editor ..." with a submission cue, to "Sincerely" and the
                               # signature, followed by the manuscript: deleted (3 of 3 letters, every paragraph)
  delete_reviewer_reply: true  # "Reply to the reviewers' comments" + the portal's table, or "Reviewer 1: ..." text
                               # up to the title page: deleted (9 of 9 articles)
  delete_counts: true          # "Number of Figures: 2", "Word count: 2173" before the abstract (13 of 14)
  delete_phone: true           # phone-only lines before the abstract (35 of 45; NI editors keep them)
  delete_orcid: false          # ORCID-only lines: kept or reworded by most journals (16 of 43 changed, 17 kept)
  delete_title_repeat: true    # "Title - ..." over the abstract when the title page above already has the title
  delete_front_statements: true  # "Running head- ...", "FUNDING/SUPPORT- ...", "CONFLICT OF INTEREST- None" left between
                               # the abstract and the main text (IJO_2202): deleted; funding and conflicts feed the
                               # back-matter sections
  # Kept as they are (no setting): "Key learning points" / "Key messages" (9 of 12 kept), "Plain language summary",
  # "Highlights" / "What is known?" (4 of 4). "AQ: Followed XML file for Article Type" is not added: editors wrote it
  # in 14 of 160 articles with no consistent trigger (3 of 23 whose stated type differs from the XML).
  journals:
    neurol: {delete_phone: false}
    ijo: {delete_orcid: true}  # IJO editors delete ORCID lines (4 of 4)

front_matter:  # title page: running head, type, title, authors, affiliations, correspondence, history
  enabled: true
  ai_split: true                 # Claude Haiku splits the title page into fields (needs the API key)
  title_case: sentence           # sentence | title | as_is (article title; the running head is always sentence case)
  capital_after_colon: true      # "dermoids: A comprehensive review"
  initial_period: true           # "Anjum S. K. Joad" (false: "Anjum S K Joad")
  correspondence_add_institution: false  # a correspondence street address (not a home: flat, society, quarters) in the
                                 # author's city gets the affiliation's institution in front (per journal: IJO)
  abbreviate_middle_names: true  # guide and editors: "Anjum Syed Khan Joad" -> "Anjum S. K. Joad"
  # Initials after a name go before it (guide: "Swamy AN" -> "A. N. Swamy"; frontmatter.initials_first). Applied
  # always (no setting). Editors split: JEHP / MJDRDYPU did it in 5 of 8 articles; across all journals many keep
  # "Swathi M" and cite / running-head the initial as the surname ("M S", "S, et al.") -- for the owner to confirm.
  affiliation_first_unnumbered: true  # "Asha Kumar, Ravi Rao1": the first affiliation has no number
  group_departments: false       # 39 of 42 stylesheets: duplicate affiliations "should not be grouped ... All the
                                 # affiliations should be complete" (the rule wins over the sheets' own grouped example)
  affiliation_country_each: true   # the country after every affiliation ("complete"); KJO, IJA, SJG follow the guide
  correspondence_one_line: false   # the address on the "Address for correspondence:" line after the name
  affiliation_postal_code: false   # the postal code the title page gives after an affiliation's city is printed
                                   # ("Chennai - 600 006"; per journal: IJO, JEHP)
  letters_at_end: true           # letters: author group to cite line after the letter, before the references
  correspondence_label: "Address for correspondence:"
  correspondence_drop_street: false  # street / building / office parts dropped when the address names the institution
  correspondence_prefixes: [Dr, Prof]  # the name's prefix kept or added from the submission XML's <title> (G91-92)
  email_label: "E-mail:"
  pin_spaced: true               # Indian PIN after the city: "Chennai - 600 006"
  dates:
    labels: [Received, Revised, Accepted]
    keys: [received, revised, accepted]  # which XML dates, in order
    format: "%d-%m-%Y"           # 16-09-2026
    one_line: false              # true: one paragraph, tab-separated
    missing: "???"
    without_xml: true            # no submission XML at all (a plain .docx): the dates line with "???" for each date
  cite_label: "How to cite this article:"
  cite_journal: ""               # NLM abbreviation for the cite line; per journal below
  cite_max_authors: 6
  ltr_no_running_head_query: false
  # Per-journal settings (merged over the above by the code the style is loaded with), from the stylesheets and the
  # editors' files. Journals loaded under an alias (Neurol -> ni, LungIndia -> lung, SMJ -> sgmj) keep theirs in
  # styles/<journal>.yaml under front_matter:, which applies whichever code is used.
  journals:
    # type_qualifier keep: the type as the XML gives it, "Case Report (for IJO Case Reports)" (the sheet is silent;
    # the IJO editors keep the XML type with its qualifier in every typed article, 16 of 16)
    ijo: {type_qualifier: keep, title_case: sentence, initial_period: false, correspondence_label: "Correspondence to:",
          dates: {labels: [Submitted, Revised, Accepted], format: "%d-%b-%Y", one_line: true},
          cite_label: "Cite this article as:", cite_journal: Indian J Ophthalmol,
          cite_journal_case_reports: Indian J Ophthalmol Case Rep, ltr_no_running_head_query: true}
    dshmj: {cite_journal: Dr Sulaiman Al Habib Med J}
    joacc: {title_case: title, cite_journal: J Obstet Anaesth Crit Care}
    abr: {affiliation_first_unnumbered: false, title_case: title, cite_journal: Adv Biomed Res, dates: {labels: [Submitted, Revised, Accepted]},
          group_departments: false, affiliation_country_each: true}  # S: "should not be grouped ... complete", example 1, 2
    aca: {title_case: title, cite_journal: Ann Card Anaesth}
    aian: {title_case: title, cite_journal: Ann Indian Acad Neurol}  # initial_period: G50 "Anjum S. K. Joad" (sheet silent)
    aomd: {affiliation_first_unnumbered: false, cite_journal: Ann Mov Disord}
    crst: {cite_journal: Cancer Res Stat Treat}
    idoj: {title_case: title, cite_journal: Indian Dermatol Online J}  # S example: first affiliation unnumbered
    ija: {title_case: sentence, cite_journal: Indian J Anaesth}  # S: "always follow manuscript files ... Sentence case"
    ijc: {cite_journal: Indian J Cancer, correspondence_label: "Correspondence to:"}
    ijcm: {cite_journal: Indian J Community Med}
    ijd: {title_case: title, cite_journal: Indian J Dermatol}
    ijdr: {title_case: title, cite_journal: Indian J Dent Res}  # S example: "Department of ..., 1Department of ..."
    ijem: {title_case: title, dates: {labels: [Submitted, Revised, Accepted], format: "%d-%b-%Y"}}  # S: Title case; 22-Feb-2020
    ijoem: {title_case: title}  # S: "Article title | Title case"
    jpbs: {title_case: title, affiliation_first_unnumbered: false}  # S: Title case; "author sequence 1,2,3,4"
    ijnmr: {title_case: title, cite_journal: Iran J Nurs Midwifery Res, affiliation_first_unnumbered: false}  # S: "link should start with 1"
    ijpm: {cite_journal: Indian J Pathol Microbiol, dates: {labels: [Submitted, Revised, Accepted], format: "%d-%b-%Y"}}
    ijpvm: {title_case: title, cite_journal: Int J Prev Med,
            dates: {labels: [Received, Accepted], keys: [received, accepted], format: "%d %b %y", one_line: true}}
    indianjpsychiatry: {cite_journal: Indian J Psychiatry, affiliation_first_unnumbered: false, group_departments: false,
                        affiliation_country_each: true}  # S: "should not be grouped ... complete", example 1, 2
    ipj: {cite_journal: Ind Psychiatry J}
    jcrt: {cite_journal: J Cancer Res Ther}
    jdrntruhs: {cite_journal: J NTR Univ Health Sci}
    jehp: {cite_journal: J Educ Health Promot}
    jfmpc: {affiliation_first_unnumbered: false, cite_journal: J Family Med Prim Care}
    jomfp: {cite_journal: J Oral Maxillofac Pathol}
    jpgm: {cite_journal: J Postgrad Med}
    mjdrdypu: {cite_journal: Med J DY Patil Univ}
    njcp: {title_case: title, cite_journal: Niger J Clin Pract,
           dates: {labels: [Date of Acceptance], keys: [accepted]}}  # S: "Date of Acceptance: ???"
    joacp: {ltr_no_running_head_query: true}  # S: "No need to raise Author Query for Running title in LTE articles"
    njms: {cite_journal: Natl J Maxillofac Surg}
    sja: {cite_journal: Saudi J Anaesth}
    sjg: {affiliation_first_unnumbered: false, cite_journal: Saudi J Gastroenterol}
    wjcs: {cite_journal: World J Colorectal Surg, dates: {labels: [Submitted, Revised, Accepted]}}  # S: "Submitted: 00-00-0000"

copyedit:
  spelling:
    enabled: true
    convention: american       # british | american | follow_author | none (most Medknow journals: American)
    british_z: false           # british with Oxford -ize instead of -ise
    max_level: 70              # VarCon/SCOWL word level; rarer clusters hold odd forms ("colourectal")
    journals: {}               # journal code -> convention; prefer copyedit.spelling.convention in styles/<journal>.yaml
    skip: [acknowledgement, acknowledgements]  # never converted (guide: "Acknowledgement" heading in UK spelling)
    extra:                     # conversions VarCon does not make (it lists "analogue" as American too, in the
      american: {analogue: analog, analogues: analogs}  # "analogous" sense); "visual analogue scale" is kept
  abbreviations:
    enabled: true
    query_undefined: true      # "ABBR: Kindly expand the abbreviation."
    query_before_definition: true
    move_definition: false     # instead of a query, move the expansion to the first use
    redefinition: query        # full form (ABBR) again in one scope: query | change (-> "ABBR") | off
    unused_definition: "off"   # "(ABBR)" never used again: change (drop it) | query | off. Off: on 158 articles the
                               # copy editors kept the definition 3 times in 4 (precision 26%, closure -2.5%)
    full_form_after_definition: change  # full form again after the definition: change (-> "ABBR") | query | off;
                               # only in the main text, when the author uses ABBR more often than the full form
    allow: []                  # extra abbreviations that need no expansion
    query: []                  # abbreviations of the common list still asked for in this journal (JEHP: CVI, CVR)
    defined_in_article: false  # true: no "Kindly expand" for an abbreviation the article expands elsewhere (the
                               # abstract, an abbreviation list or table note, "(SCOFF)" after its description)
  languagetool:
    enabled: true              # skipped when no server answers (python -m edit_os.copyedit languagetool start)
    language: null             # en-GB / en-US; default follows the spelling convention
    level: picky               # LanguageTool's rule level; picky enables UNIT_SPACE
    rules:                     # rule IDs whose single suggestion becomes a change (tuned with tools/eval_ce.py)
      - HYPHEN_TO_EN           # 18-81 years -> 18–81 years
      - UNIT_SPACE             # 10mg -> 10 mg (picky level)
      - CONSECUTIVE_SPACES     # never next to symbol-font characters (± often sits between two spaces)
      - DASH_RULE
      - COMMA_PARENTHESIS_WHITESPACE  # "word ," -> "word,"
      - SPACE_BEFORE_PARENTHESIS
      - CA_FOLLOW_UP           # follow up (noun) -> follow-up
      - YEAR_OLD_HYPHEN        # 45 year old -> 45-year-old
      - DECISION_MAKING
      - FROM_X_Y
      - BETWEEN_TO_AND         # between 5 to 10 -> between 5 and 10
      - SENT_START_CONJUNCTIVE_LINKING_ADVERB_COMMA  # "However the" -> "However, the"
      - ALL_OF_THE
      - EN_COMPOUNDS_FOLLOW_UPS
      - EN_COMPOUNDS_LONG_STANDING
      - EN_COMPOUNDS_SHORT_LIVED
    categories: []
    disabled_rules: []
    warn_categories: []        # other matches in these categories go to the editor as warnings
  claude:                      # B4: Claude copy-edit pass (edit_os/copyedit/claude_pass.py); off without EDITOS_ANTHROPIC_API_KEY
    enabled: true
    model: claude-haiku-5-5    # EDITOS_CE_MODEL (else EDITOS_MODEL) overrides. 16 held-out articles: Haiku 70% precision,
                               # $0.0025/article; Sonnet 5.5 61%, $0.026; Opus 5.5 65%, $0.063 (tools/eval_ce.py)
    effort: medium             # EDITOS_CE_EFFORT overrides; medium beat low on Haiku (precision 70.1% vs 67.2%, 26% more edits)
    chunk_words: 1500          # paragraphs per request, up to about this many words
    examples: 40               # few-shot copy-editor edits (training articles only), same journal first
    examples_path: null        # private changes.jsonl of past edits (or EDITOS_CE_EXAMPLES); never committed
    max_words: 6               # longest edit (words in old, after trimming to what changes)
    max_chars: 60
    max_queries_per_chunk: 1   # copy editors query rarely; only real ambiguity
    min_confidence: certain    # certain | likely: keep only edits Claude marks certain
    skip_kinds: []             # e.g. [word_choice] to turn a kind of suggestion off
    close_prefixes: false      # close up prefixed compounds (postoperative); on where the journal's copy editors do

autopilot:  # "Autopilot" on the review screen (edit_os/autopilot.py): accepts pending suggestions it is sure of
  accept_sources: [rule]       # rules, verified references, NLM abbreviations, spelling, LanguageTool, front matter
  hold: [sections_back_matter.consent_added, fmt_color, figure_insert, submission_reviewer_reply]  # left for the editor: boilerplate consent text; colour (editors keep it in ~half); pictures from the zip; reply-to-reviewer text removed from the manuscript (a wrong boundary once took half an article)
  ai_judge: true               # Claude's copy edits: accepted only when a second Claude check agrees; else left
  model: claude-haiku-5-5      # EDITOS_AUTOPILOT_MODEL overrides
