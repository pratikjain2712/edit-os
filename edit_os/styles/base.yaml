# Shared Wolters Kluwer - Medknow style. Journal files override any key.
name: Base (Medknow)

citations:
  brackets: square          # (4) -> [4]
  after_punctuation: true   # "region (4)." -> "region.[4]"
  multiple_delimiter: ","   # [1,2,4], no space
  range_dash: "-"           # [6–9] -> [6-9]
  two_number_range_as_list: true  # [1-2] -> [1,2]

headings:
  tag: true  # prefix headings with <H1> / <H2> for typesetting
  h1: [abstract, introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references,
       case report, case reports, case presentation, review of literature]
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, acknowledgment, acknowledgments, acknowledgement,
       acknowledgements, author contribution statement, author contributions, data availability statement,
       ethical approval, ethics approval]
  strip_trailing_colon: true

statistics:
  space_around_operators: true  # p=0.03 -> p = 0.03

references:
  lookup: true                 # rebuild entries from PubMed / CrossRef when they match strictly
  ai_parse: true               # Claude splits entries into fields first (needs ANTHROPIC_API_KEY)
  max_authors: 6               # more than 6 -> first 6, et al.
  et_al: "et al."
  initials_without_periods: true  # "Lindqvist P.," -> "Lindqvist P,"
  page_range_compress: true    # 101-109 -> 101-9
  page_range_dash: "-"
  drop_issue: true             # 2017;12(3):101-9 -> 2017;12:101-9
  no_period_before_year: true  # J Med Genet. 1987;24 -> J Med Genet 1987;24
  capitalize_after_colon: true # "dermoid: a case report" -> "dermoid: A case report"
  title_sentence_case: true    # "Treatment of Metastatic Cancer" -> "Treatment of metastatic cancer"
  journal_abbreviation: nlm    # Index Medicus abbreviation from NLM's journal list
  journal_drop_qualifier: true # "Spine (Phila Pa 1976)" -> "Spine", as the editors do
  other:                       # books, links, conference papers, reports, theses (refs_other.py)
    enabled: true              # template fixes: "Available from: URL. [Last accessed on 2010 Jul 10].", "4th ed."
    check_links: true          # open each URL: dead links, soft 404s and redirects become queries
    verify_books: true         # look books up in CrossRef and Open Library
    query_unverified: true     # conference papers, reports, theses: query that they could not be verified

keywords:
  min: 3
  max: 5
  alphabetical: true

required_sections:
  - {heading: Conflicts of interest, default: "There are no conflicts of interest."}
  - {heading: Financial support and sponsorship, default: "Nil."}
expected_h1: [conclusion]

formatting:  # run formatting from the pre-editing guide, rendered as tracked formatting
  enabled: true
  et_al_italic: true           # body "et al." in italics (never in the reference list)
  et_al_period: true           # "et al" -> "et al."
  latin_italic: true           # in vivo, in vitro, in situ, ex vivo
  p_values: true               # probability P in italics
  p_capital: false             # "p < 0.05" -> "P < 0.05": copy-edit pass (style editors leave p as typed)
  n_variable_italic: true      # "n = 34": italic n
  superscript_citations: true  # body citations [4] in superscript

figures:                        # figure and table citations and captions (rules_figures.py)
  citations: true
  brackets: square              # (Figure 1) -> [Figure 1]
  figure_label: Figure          # "Fig. 1" -> "Figure 1" (every journal but IJO in the editors' files)
  figure_label_plural: Figures
  part_labels: lower            # Figure 1A -> Figure 1a: what the editors do (the guide says uppercase)
  part_case_query: false
  range_dash: "–"               # "Tables 1 to 3" -> "Tables 1–3"
  compress_lists: false         # "Tables 1, 2 and 3" -> "Tables 1–3"
  captions: true
  caption_separator: ": "       # "Table 1. Title" -> "Table 1: Title"
  caption_end_period: false     # delete the period at the end of a caption
  queries: true                 # out of order, cited without caption, caption never cited

renumber:                       # duplicate references and citation-order renumbering (renumber.py)
  enabled: true
  remove_duplicates: true       # guide E.g. 3
  reorder: true                 # guide E.g. 4; never when a reference is uncited (E.g. 5)
  compress_from: 3              # renumbered [4,5,6] -> [4-6]; two numbers stay a list
