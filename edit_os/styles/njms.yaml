# National Journal of Maxillofacial Surgery (StyleSheet_NJMS.docx); only the settings that differ from base.yaml.
name: National Journal of Maxillofacial Surgery

# not yet automated:
#   - ethical clearance query in every original article

sections:
  headings:
    case: upper  # S: "H1 | Capital case, Bold, Roman"
  abstract:
    heading: ABSTRACT  # S: 'The word "ABSTRACT" should be added as heading'

figures:
  table_caption_end_period: delete  # the sheet has no "The caption should end with a period": G200 deletes it
