# Indian Journal of Dermatology (StyleSheet_Sample_IJD.docx); only the settings that differ from base.yaml.
name: Indian Journal of Dermatology

# not yet automated:
#   - letters: add 'Dear Editor' when there is no salutation (an existing 'Sir,' is replaced)

formatting:  # measured with tools/eval_format.py against the style editors' tracked files
  body_unbold: false  # editors keep bold in running text (0 of 9)

sections:
  letter_salutation: "Dear Editor,"  # S: LTE articles start with “Dear Editor” instead of “Sir” / “Dear Sir/Madam”
  back_matter:
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'
