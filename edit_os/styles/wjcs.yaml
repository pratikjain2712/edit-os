# WJCS (StyleSheet_Sample_WJCS---.docx); only the settings that differ from base.yaml.
# Tuned against 3 style-edited articles: closure 14.6% (hurt 15) -> 15.0% (hurt 9) (base only -> this file).
name: WJCS

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]

# statistics.space_around_operators as base (G297: "add space on either side of operators")

sections:
  headings:
    case: upper  # S: "H1 | All Caps, Bold, Roman"
  abstract:
    # the sheet has no "... changed to “Methods”" line: G114 (METHODS -> MATERIALS AND METHODS, in the sheet's Title case)
    rename: {materials and methods: Materials and Methods, methodology: Materials and Methods,
             methods and materials: Materials and Methods, methods and material: Materials and Methods,
             material and methods: Materials and Methods, materials and method: Materials and Methods,
             methods: Materials and Methods, method: Materials and Methods}
    word_limit_query: false  # no word-limit line
  back_matter:
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'

# not yet automated:
#   - journal title not given in the stylesheet
#   - edited books: '1995:465-78' (colon before pages, no 'p.')
#   - structured abstract for original articles, meta-analyses and systematic reviews
