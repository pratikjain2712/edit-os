# Journal of Family Medicine and Primary Care (StyleSheet_Sample_JFMPC.docx); only the settings that differ from base.yaml.
# Tuned against 3 style-edited articles: closure 9.7% (hurt 12) -> 10.5% (hurt 10) (base only -> this file).
name: Journal of Family Medicine and Primary Care

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]
  # base list + limitations (the editor tags these <H2>)
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, acknowledgment, acknowledgments, acknowledgement,
       acknowledgements, author contribution statement, author contributions,
       data availability statement, ethical approval, ethics approval, limitations]

# references: as base. S example "Statin therapy prescribing ...: A review of current evidence and challenges. J Pharm
# Bioall Sci 2017;9:80-7" (sentence-case titles, hyphen): the editor's en dash and kept capitals are on the owner's list.

copyedit:
  spelling:
    convention: follow_author  # from the copy editors' practice (tools/eval_ce.py)

# not yet automated:
#   - affiliations numbered per author and not repeated

# formatting.table_head_bold: as base (S: "Column heads | Sentence case, bold"; editors 0 of 5: owner's list)

sections:
  back_matter:
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'
