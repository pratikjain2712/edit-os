# Indian Journal of Anaesthesia (StyleSheet_Sample_IJA RG comments_Updated.docx); only the settings that differ from base.yaml.
# Tuned against 6 style-edited articles: closure 5.3% (hurt 26) -> 5.4% (hurt 25) (base only -> this file).
name: Indian Journal of Anaesthesia

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]

copyedit:
  spelling:
    convention: british  # from the copy editors' practice (tools/eval_ce.py)

# not yet automated:
#   - no serial comma
#   - lists with round bullets
#   - structured abstract (Background and Aims, Methods, Results, Conclusion), run-on, max 250 words
#   - original articles: add '<H2>Statement on data sharing' with the journal's standard text before references
#   - ORCID iDs for all authors (query if missing); salutations in correspondence
#   - references: add DOI for online-only articles without page numbers (query if missing)
#   - cite the reference right after an author's name when the author is named in the text
#   - query IRB number in original articles; 'Supplementary Material' instead of Appendix
#   - delete an 'EIC-XXXX' number at the top without query

formatting:  # measured with tools/eval_format.py against the style editors' tracked files
  remove_font_color: false  # editors keep the author's colours (0 of 40)

sections:
  headings:  # S: "Methods (not Materials and Methods or Patients and Methods)"; "H1 | All Caps"
    case: upper
    rename: {methods: Methods, method: Methods, methodology: Methods, materials and methods: Methods,
             material and methods: Methods, patients and methods: Methods, patient and methods: Methods}
  abstract:  # S: "Background and Aims / Methods / Results / Conclusion"; "Abstract should not be more than 250 words"
    word_limit: {structured: 250, unstructured: 250}

front_matter:
  group_departments: true       # no rule in this stylesheet: the guide groups duplicate affiliations
  affiliation_country_each: false
