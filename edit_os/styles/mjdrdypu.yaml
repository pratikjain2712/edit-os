# Medical Journal of Dr. D.Y. Patil Vidyapeeth (StyleSheet_mjdrdypu.docx); only the settings that differ from base.yaml.
# Tuned against 3 style-edited articles: closure 38.6% (hurt 25) -> 38.8% (hurt 22) (base only -> this file).
# Re-tuned on 16 training articles (13 new + those 3; 6 style editors): closure 55.8% (helped 252, hurt 37) -> 63.6%
# (306, 22) after merging the JEHP work. 13 held-out articles: 37.9% (160, 31) -> 39.7% (168, 27).
# Stylesheet-first audit: the stylesheet and the pre-editing guide win over these editor counts where they speak.
name: Medical Journal of Dr. D.Y. Patil Vidyapeeth

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]
  # subheading_case: sentence as base (S: "H2 | Sentence Case"; editors lower Title Case heads)

# statistics.unary_after_word: false as base (G301 unary signs closed; editors agree: 33 -> 9 hurt, 59 helped)

guide_replace:
  # p_value_capital: on in base (G294; editors 28 of 28 in 5 training articles)
  range_dash: true       # "2-6 years", "(1.01-1.06)" -> en dash: 47 of 52 numeric ranges in 7 training articles
  table_rules: [range_dash]  # (37 of them in tables; the 5 kept are one article; the sheet and guide are silent)

figures:
  before_full_stop: true  # "immunized. (Table 1)" -> "immunized [Table 1].": 4 of 5 in 3 training articles (silent)
  # table_caption_end_period: add, as base: S "The caption should end with a period" (the editors split: 6 of 13
  # training articles add it, Subrata and ManiMekala never -- editor misses; owner's list)

sections:
  back_matter:
    order: [consent, data, contributions, funding, conflict]  # as the editors place them (S: consent "before the
                                                              # Financial support and sponsorship section")
    contributions:
      from_sources: true         # stylesheet: add Author Contribution if given in source or FP; editors did in 5 of 6
      query_missing: true        # ... and query it when missing
      heading: Author contribution  # S: "Kindly add Data availability statement and Author Contribution"; editors 7 of 10
    data_availability:
      enabled: true              # stylesheet: add Data availability statement if given in source or FP; editors did
      query_missing: true        # in 6 of 8 training articles whose title page had one; query when missing

# front_matter.abbreviate_middle_names: as base (G50 "In case middle name is present then please abbreviate it as
# initial"; the sheet is silent). The editors keep full middle names (authors similarity 77.0% vs 82.8%): owner's list.

copyedit:
  claude:
    close_prefixes: true  # copy editors close up prefixes (post-operative -> postoperative): 9.7 per training article

formatting:  # measured with tools/eval_format.py against the style editors' tracked files (the sheet is silent)
  body_unbold: false  # editors keep bold in running text (0 of 12)
  remove_font_color: false  # editors keep the author's font colours (removed 0 of 238 the rule proposed, 16 training articles)

text:
  prefixes: {enabled: true}  # copy editors close prefixes (rules_text.py): 14 proposed, 86%
