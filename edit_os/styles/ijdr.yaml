# Indian Journal of Dental Research (StyleSheet_Sample_IJDR_updated.docx); only the settings that differ from base.yaml.
name: Indian Journal of Dental Research

copyedit:
  spelling:
    convention: british  # from the copy editors' practice (tools/eval_ce.py)

# not yet automated:
#   - at most six authors: query for a justification letter when there are more
#   - affiliations: 'Department of X, 1Department of Y' (repeat 'Department')
#   - structured abstract run-on
#   - abstracts also for case reports

figures:
  table_caption_end_period: delete  # the sheet has no "The caption should end with a period": G200 deletes it
