# Singapore Medical Journal (SGMJ journal stylesheet [updated 2Jan26].docx); only the settings that differ from base.yaml.
# Tuned against 5 style-edited articles: closure 13.2% (hurt 22) -> 13.4% (hurt 19) (base only -> this file).
name: Singapore Medical Journal

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]

figures:
  # captions on (base): S 'Figure caption | “Figure 1:” followed by caption in sentence case; bold; should have an end
  # period' and "Table | Table 1; Sentence case; bold; should have an end period" (editors were inconsistent).
  figure_caption_end_period: add

sections:
  headings:
    case: upper  # S: "H1 | All Caps, Bold, Roman"
    # S: "H1 | INTRODUCTION (not BACKGROUND)"; "Original Articles should contain first-level headings as: Introduction,
    # Methods, Results and Conclusion"
    rename: {background: Introduction, methods: Methods, method: Methods, methodology: Methods,
             materials and methods: Methods, material and methods: Methods, patients and methods: Methods,
             subjects and methods: Methods}

front_matter:  # (was front_matter.journals.smj in base.yaml: here it applies under either code)
  cite_journal: Singapore Med J
  correspondence_label: "Correspondence:"  # S: 'The word “Correspondence:” in bold'
  capital_after_colon: false
  affiliation_first_unnumbered: false  # S: "All affiliations are numbered"
  dates: {labels: [Received, Accepted], keys: [received, accepted], format: "%d %b %Y", one_line: true}

copyedit:
  spelling:
    convention: british  # from the copy editors' practice (tools/eval_ce.py)

# not yet automated:
#   - author names in full with surname last and underlined; keep up to 2 qualifications
#   - correspondence with salutation ('Dr', no period); 'Correspondence:' label
#   - structured abstract: Introduction, Methods, Results, Conclusion in separate paragraphs
#   - H1 'INTRODUCTION' (not Background); original articles: Introduction, Methods, Results, Conclusion
#   - lists: 1., 2. then (a), (b) or bullets; CME article label and CME quiz; opening/closing vignettes
#   - edited books: '1995:465-78' (colon before pages, no 'p.')
#   - Graph/Chart/Diagram/Video citations -> 'Figure X'
