# Journal of Postgraduate Medicine (StyleSheet_Sample_JPGM.docx); only the settings that differ from base.yaml.
name: Journal of Postgraduate Medicine

copyedit:
  spelling:
    convention: follow_author  # from the copy editors' practice (tools/eval_ce.py)

# not yet automated:
#   - structured abstract run-on

sections:
  abstract:
    heading: ABSTRACT  # S: 'The word "ABSTRACT" should be added as heading'

figures:
  table_caption_end_period: delete  # the sheet has no "The caption should end with a period": G200 deletes it
