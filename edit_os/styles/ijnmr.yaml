# Iranian Journal of Nursing and Midwifery Research (StyleSheet_IJNMR.docx); only the settings that differ from base.yaml.
name: Iranian Journal of Nursing and Midwifery Research

# not yet automated:
#   - affiliation links start at 1; country not repeated
#   - abstract for original articles only, structured as Background, Methods, Results, Conclusion
#   - no author queries about history dates

sections:
  headings:  # S: "H1 | Heading should be Methods as per journal specification"
    rename: {methods: Methods, method: Methods, methodology: Methods, materials and methods: Methods,
             material and methods: Methods, patients and methods: Methods, subjects and methods: Methods}
  abstract:
    word_limit_query: false  # the IJNMR sheet has no word-limit line
  back_matter:
    consent: {enabled: false}  # the stylesheet has no "Declaration of patient consent" rule

figures:
  table_caption_end_period: delete  # the sheet has no "The caption should end with a period": G200 deletes it
