# Journal of Education and Health Promotion (StyleSheet_Sample_JEHP.docx); only the settings that differ from base.yaml.
# Tuned on 17 training articles (six style editors); counts below are articles of those 17. The stylesheet and the
# pre-editing guide win where they speak; the editors' habits are kept only where both are silent.
name: Journal of Education and Health Promotion

# not yet automated:
#   - structured abstract: sub-headings and text in separate paragraphs (S: "not run-on")

headings:
  # No "Abstract" tag: the editors leave the abstract heading untagged (16 of 16; 0 "<H1>Abstract").
  # G139: '"Case History" or "Case Report" or "Discussion" or "Result" should be first level heading' ("Result" ->
  # "Results" under sections.headings.rename). G146 / G133: "The heading 'Acknowledgement' should be 14 points font size
  # bold style", the first level's size: <H1> (the editors split 12 / 12 between <H1> and <H2>: owner's list).
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references,
       case report, case reports, case presentation, case history, review of literature,
       acknowledgment, acknowledgments, acknowledgement, acknowledgements]
  # The JEHP template's Methods sub-heads and back-matter statements the editors tag <H2> (base list plus
  # "Ethical consideration(s)": 14 of 17, "AI policy statement": 2).
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, author contribution statement, author contributions, data availability statement,
       ethical approval, ethics approval, ethical consideration, ethical considerations, ethics considerations,
       ai policy statement]
  # Other statement heads after the Conclusion ("Data availability", "Consent for publication", "Declaration of
  # AI-assisted writing"): <H2> as the listed ones (S: "H2 | Sentence Case, Bold, Roman, flush left"); the editors
  # tag every bold back-matter head they keep (H2 in 14 of 17 articles), the sheet does not list them.
  back_matter_subheadings: true
  sentence_case_hyphen_parts: true  # S: "H2 | Sentence Case" (and table captions): "Within-Group Comparison" ->
                                    # "Within-group comparison"; names never in lower case in the text keep it
  # subheading_case: sentence as base (S: "H2 | Sentence Case"; editors lowered Title Case sub-heads in 5 of 6)
  # S: "Headings (three levels only)": a head right over another head is the parent (<H2>) of the heads below it
  # (<H3>: 1401, 1044, 1751, 1772); heads over a figure / table caption, "Antimicrobial Activity: Synthesis and ..."
  # heads, a bold run-in "Study Design: Eligible ..." alone in its section split off (1486), "1. Demographic
  # Characteristics" heads (1751); italic heads are <H3> only in a section that has bold ones (1410).
  nested_subheadings: true
  sentence_case_brackets: true  # S: "H2 | Sentence Case": "Anti-Candida Activity (In Vitro)" -> "... (in vitro)" (1044)
  # "References:" -> "References", "Materials and Methods:" -> "Materials and Methods", "Acknowledgment:" (body and
  # back-matter headings; not the structured abstract's run-in "Purpose:" nor "Keywords:"): the editors drop the
  # colon; G137 says retain it -- the owner follows the editors (owner, 2026-10-26).
  strip_trailing_colon: true

# statistics.unary_after_word: false as base (G301: unary "><space>10 -> >10"; editors 0 of 20 spaced)

citations:
  # S310: "Bibliography citations should be within square bracket, superscript style ..., after punctuations": the
  # citation stays where the author put it, as the editors keep it (a passage's closing citation moved next to the
  # study's name: 23 kept, 7 moved, in 33 articles of jehp_test + jehp_train).
  next_to_author: false
  compress_from: 3  # "[18,19,20]" -> "[18-20]": the editors 4 of 4 (944, 1209 ×3); the sheet's "[1,2,4]" has no run
  # S320: 'If citations are present in "surname, year" format and not in numbers then change them to respective
  # reference numbers': "Sorte et al. (2025) reported" -> "Sorte et al.[2] reported" when the numbered list has
  # exactly one entry by that first author in that year (rules.rule_author_year). The year next to a number goes
  # ("Nagarajappa et al. (2015) [7]" -> "Nagarajappa et al.[7]": 1044, 1562, 1580, 1751, 1764); a study column's
  # "Saulnier et al., 2022.[9]" keeps it (1410).
  author_year: true

guide_replace:
  # p_value_capital, trailing_space, leading_space: on in base (G294, G143)
  range_dash: true        # numeric ranges "46-55 years" -> "46–55": editors 19 of 21 in 6 articles (silent; the sheet's
                          # own "Tables 1–6" uses the en dash); citation ranges keep the hyphen
  double_space: true      # 44 of 62 (7 articles; one editor kept 17 in one article); the sheet and guide are silent
  smart_quotes: true      # straight apostrophes made curly in 11 of 16 articles that have them; straight double
                          # quotes in 3 of 3 (silent)
  abbreviation_colon: true  # "Abbreviations: CI, confidence interval" -> "CI: confidence interval": 3 of 3 lists
                            # (S: 'Abbreviations should be as per format "term 1: definition, term 2: definition"';
                            # the same sheet also gives "term<space>=<space>definition": owner's list)
  # In table cells too (the guide's table is not limited to running text; G293 "in all locations other than
  # references"). Style editors' table cells, 33 articles (jehp_test + jehp_train), each finder alone: range_dash
  # 23 closer / 1 further, unary_comparison 15 / 0, unary_minus (G300) 25 / 15 (1153 keeps the hyphen; 4 more
  # used an en dash), ampersand 2 / 2 (G293 asks for it), p_value_capital "p" heads 1646 ×3, ">=" 1787 ×2.
  table_rules: [range_dash, unary_minus, unary_comparison, p_value_capital, comparison_symbol, smart_quotes,
                ampersand]  # unary signs closed up in cells too (G300 / G301; owner, 2026-10-26)

# S: "The caption should end with a period": table and figure captions alike (owner, 2026-10-26: keep the sheet over
# G261, which deletes a legend's final period; editors 9 add, 8 leave none on table captions).
figures:
  table_caption_end_period: add
  figure_caption_end_period: add
  graph_caption_end_period: add
  lowercase_labels: true  # "in table 2" -> "in Table 2" (S: "Table citation | Tables 1–6; Table 1; Tables 2 and 3";
                          # editors 4 of 4 tables, 2 of 3 figures)
  table_footnote_end_period: delete  # S: "Table footnotes | ... Period should be deleted at end of last footnote"
                                     # (editors 3 of 5)
  # S260 / G241 / G250: 'In case citations are present within round/curly brackets then the brackets should be changed
  # to square brackets'. A bracket that opens with "see" / "shown in" before the label is a citation too; the editors
  # drop the words ("(see Figure 1)" -> "[Figure 1]", "(shown in figure 5)" -> "[Figure 5]": 1401 ×13, 0 kept).
  bracket_lead_words: drop
  # "analyses. (Table 3)" -> "analyses [Table 3].": the editors 3 of 3 (1044 ×2, 1039); the sheet is silent.
  before_full_stop: true
  table_caption_case: sentence  # S: 'The label should be "Table<space>#:<space>" followed by caption content in bold
                                # style and Sentence Case' (editors leave most captions as typed: owner's list)
  # S: "Column heads | Sentence case, bold" ("Study Design" -> "Study design": 1044, 1193, 1401, 1486, 1562, 1751) and
  # "In case the content is in All Caps then please make it as Title Case".
  table_heads_case: sentence
  table_heads_title_case: true
  # S244 'Abbreviations should be as per format "term<space>=<space>definition"', S246 "Comma should be delimiter
  # between abbreviations" (1646, 1732, 1772, 1874). The struck S232 (live, owner 2026-10-24) reads "term 1:
  # definition": the owner follows the editors, "term = definition" ("CI: confidence interval" -> "CI = confidence
  # interval" too: owner, 2026-10-26).
  table_footnote_abbreviation: " = "
  table_footnote_delimiter: ","
  # "Table 1. Baseline characteristics (N=100). IQR, interquartile range; SD, standard deviation." -> caption +
  # footnote under the table (the editors in 1787; S: notes are table footnotes).
  table_caption_notes: split
  # Legend text in sentence case, first word capitalised ("Figure 2: depicts" -> "Depicts"): the sheet is silent on
  # case; the editors set Title Case legends in sentence case (1044, 1266, 1401, 1580); S398 "all sentences start
  # with a capital letter" (1410).
  figure_caption_case: sentence
  # G265 "The caption(s) should be placed at end of document (before table if present)", G195 the tables "at end of
  # document after figure captions": the JEHP editors move both in every article with figures / tables in the body
  # (1044, 1401, 1486, 1562, 1580, 1751, 1764, 1772, 944). Headings (the sheet is silent; editors' insertions):
  # "Figures" over several legends (10 of 15 articles), "Figure Legend" over one (3 of 4); "Tables" (every article).
  legends_to_end: true
  legends_heading: Figures
  legends_heading_single: Figure Legend
  tables_to_end: true
  tables_heading: Tables
  # The sheet is silent on where a table caption sits; the JEHP editors put it in a merged first row of the table in
  # every article whose captions were outside it (21 of 21 test and training articles with tables).
  table_caption_row: true
  query_no_captions: true  # G244: figures cited, no legend in the file (1486: "Please confirm caption for all figures")

sections:
  # S: the reference list's heading is "REFERENCES" (set in title case as the other H1 heads): "Reference" ->
  # "<H1>References" (editors: 2 of 2 TRAIN articles with "Reference").
  headings:
    reference_heading: References
    strip_sub_numbering: true  # "1. Demographic Characteristics" -> "<H2>Demographic characteristics" (editors 4 of 4)
    # G138 renames "Methods" / "Method" / "Methodology" (base); its misspelt forms likewise (editors: "Material and
    # Methods" 2 of 3, "Material and Method:" 1 of 1). G139: "Result" is a first-level heading: "Results" (1 of 1).
    rename: {material and methods: Materials and Methods, material and method: Materials and Methods,
             materials and method: Materials and Methods, result: Results}
  # abstract.rename: as base. S: 'The sub-headings “Materials and Methods” or “Methodology” should be changed to
  # “Methods”' (struck through in the sheet, still live; the JEHP editors keep "Materials and Methods" in 17 of 17):
  # applied and no longer held for the editor (owner, 2026-10-26).
  abstract:
    rename: {conclusions: Conclusion}  # "Conclusions" -> "Conclusion": 2 of 3 (the sheet is silent)
    heading_case: true  # S: 'The word "Abstract" should be added as heading': "ABSTRACT" -> "Abstract" (editors 2 of 2)
  back_matter:
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'
    # The sheet and guide say nothing on nil statements: the editors' habit.
    delete_nil_statements: false  # the author's "The authors declare no conflict of interest." stays (10 of 13
                                  # articles keep the wording; deleting it hurt 13 paragraphs)
    reword_nil: false
    # Ethics / consent / trial statements that only say "Not applicable." go, inline or under their own heading
    # (editors: 1044, 1588, 1751, 1787); one with a reason ("Not applicable. This study did not involve human
    # participants") stays as its own section (1401). The sheet is silent.
    nil_ethics_bare_only: true  # delete_nil_ethics on as base
    # "Acknowledgement: The authors ...", "Consent to Publish: ...", "Generative AI Usage: ..." and statements run on in
    # one paragraph ("Trial registration: ... Financial support and sponsorship: Nil. Conflicts of interest: ...") ->
    # a heading and its statement each (S: H2; editors 1401, 1787)
    split_run_in: true
    data_heading: Data availability statement  # "Data availability:" -> the H2 list's wording (editors 2 of 2)
    acknowledgement_heading: Acknowledgement  # G146: "The heading 'Acknowledgement'" (UK spelling), <H1> (owner,
                                              # 2026-10-26)

required_sections:
  # "Finance support and sponsorship" (the submission template's wording) is this section: renamed (editors 3 of 4); with
  # it (or the heading) there, an author's own "Funding" statement keeps its label (1646, 1732, 1486).
  - {heading: Financial support and sponsorship, default: "Nil.", variants: [Finance support and sponsorship]}
  - {heading: Conflicts of interest, default: "There are no conflicts of interest.",
     keep_labels: [Conflict of interest]}  # kept as written in 5 of 6 articles (the sheet is silent)

references:
  # Typed labels "1.<tab>" removed and the list numbered by Word (the sheet is silent): the JEHP editors (te and ce
  # alike) in 13 of the 17 articles with typed labels (test 6 of 7: 1266, 1562, 1580, 1732, 1772, 1787, kept in 1874;
  # training 7 of 10: 1153, 1209, 1280, 1402, 1559, 1588, 1683, kept in 924, 1039, 1793). One editor typed labels
  # over Word's numbering (997): owner's list. IJO keeps them as "1. " (label_period).
  label_auto_number: true
  # At most two initials per author: "Chandrasena PPCM" -> "Chandrasena PP" (the editors 6 of 8; owner, 2026-10-26)
  max_initials: 2

# references.non_indexed_journal: full as base (owner, 2026-10-26: keep -- not in NLM's list -> CrossRef's full title) (S: "Use complete name of the journal for non-indexed journals"): a CrossRef
# journal NLM does not list keeps its full title. The editors wrote an ISO-style abbreviation for 13 of 15 such
# journals ("Interact Technol Smart Educ", "J Learn Sci"): owner's list. "Indexed" is read as listed by NLM
# (J_Medline): "MIS Q", "Cogent Educ", "Glob J Health Sci" are NLM's abbreviations and stay so, while the editors of
# 1732 wrote "MIS Quarterly", "Cogent Education" (not MEDLINE-indexed): owner's question whether non-indexed means
# "not in NLM's list" or "not indexed for MEDLINE".

submission:
  copyright_notice_prefix: "Query: "  # JEHP editors write "Query: " before the copyright notice (7 of 9)

formatting:  # measured with tools/eval_format.py against the style editors' tracked files (the sheet is silent)
  body_unbold: false  # editors keep bold in running text (0 of 6)
  heading_bold_tagged: true  # S: "H1 | Title case, Bold", "H2 | Sentence Case, Bold", "H3 | ... Bold, italics": every
                             # tagged heading in bold (editors bold the plain ones, tools/eval_format.py bold+)
  remove_font_color: false  # editors removed the author's colours in 2 of 17 articles (tool precision 31%)
  heading_italic_levels: [3]   # S: "H3 | Sentence Case, Bold, italics"
  heading_roman_levels: [1, 2]  # S: "H1 | Title case, Bold, Roman", "H2 | Sentence Case, Bold, Roman"
  # Guide: 12 pt throughout, 14 pt for the article type, title, abstract heading, H1 and Acknowledgement heading,
  # left aligned, the running head centred; the sheet adds only "fourth level ... 12 points font size,
  # underlined". The JEHP editors set the whole file in Times New Roman 12 pt (te.docx: 33 of 33 articles, test and
  # train), never 14 pt (0 of 33) and leave justified text justified (80% of the final paragraphs): owner's list.
  fonts:
    enabled: true
    family: Times New Roman    # the guide and the sheet name no font: the editors' (32 of 33 articles)
    align: left                # G16 "left aligned"; headings 14 pt (owner, 2026-10-26: keep the guide; table cells
                               # keep the alignment they were typed with)
  # Greek letters, ±, ≤, ≥ and the minus sign in the Symbol font (Word's inserted symbols, w:sym), never ×, ®, ©, µ
  # (owner, 2026-10-26)
  symbol_font: {enabled: true}
  # S: "fourth level ... underlined": the tool tags three levels only (no fourth-level detection yet)

# copyedit.abbreviations: as base. S: "All abbreviations should be expanded at the first instance followed by
# abbreviation in parentheses (only abbreviation should be used thereafter)": full form after the definition ->
# the abbreviation, a second definition and a use before the definition are flagged (the copy editors did 0 of 15,
# 0 of 28, 0 of 15: owner's list).
# "Look for undefined acronyms and raise query" / "Explain nonstandard acronyms and abbreviations at first mention":
# an acronym the article expands anywhere (the abstract, an abbreviation list, a table note, "(SCOFF)" after its
# description) is not undefined, and standard ones are not queried. The copy editors raised 0 such queries in
# 17 articles; the rule is kept (S), the false ones are cut.
copyedit:
  # The Claude copy-edit pass is not a stylesheet rule; against the JEHP copy editors it is too often wrong to keep.
  # 17 training articles: accepted after Autopilot's second check 22 of 50 in the final text (44%), all its
  # suggestions 25 of 62 (40%); tools/eval_ce.py: Haiku 36.0% of 89 edits, Opus 36.1% of 183; best kinds
  # (spelling, punctuation, article) 13 of 21 (62%, about one edit per article). Off (and held, if turned back on).
  claude: {enabled: false}
  spelling:  # American as base (the sheet's "Spelling" line is empty). The editors keep "counselling" (4 of 5
             # articles) and "modelling" (3 of 3) while converting the rest (final text: 33 of 53 other conversions)
    skip: [acknowledgement, acknowledgements, counselling, counsellor, counsellors, counselled, counselling's,
           modelling, modelled, modeller, modellers]
  abbreviations:
    defined_in_article: true
    allow: [JEHP, AI, GPA, API, PTSD, NICU, ICU, HDL, LDL, RCT, IVF, PDF, URL, GPS, SMS, IT, IQ, OCD, ADHD]

text:
  ranges: {enabled: false}  # "between 46-55" -> "between 46 and 55": 0 of 2; copy editors leave it (silent)

front_matter:  # S: "Duplicate affiliation(s) ... should not be grouped together. All the affiliations should be complete"
  group_departments: false
  affiliation_country_each: true   # editors: country after each affiliation (e.g. "..., Hamadan, Iran, 1Social ...")
  # S90: the correspondence run on, the address on the name line (owner, 2026-10-26; the editors split 9 / 8, and
  # front-matter similarity fell 82.8% -> 78.2% when it was first tried)
  correspondence_one_line: true
  # S: "All the affiliations should be complete": the postal code the title page gives after the city stays;
  # "Faculty of ..." units stay as written (owner, 2026-10-26)
  affiliation_postal_code: true
  # G91-92: "Suffix and/or prefix like "Dr." ... can be present. Please retain/add period" (the sheet is silent):
  # the editors add the XML's <title> to the correspondence name -- Mrs. 3 of 4 (1266, 944, 1738), Mr. in 1209 but
  # not 1874 (1401: the XML's Mr, the editor wrote Dr.), Dr. / Prof. as before. Ms. is left out: added in 1 of 5
  # (1559; not 1576, 1646, 1683, 1732).
  correspondence_prefixes: [Dr, Prof, Mrs, Mr]
  # The sheet deletes phone, fax, URL in the correspondence and is silent on street and office lines: the editors
  # drop them when the address names the institution (1646, 1787, 1874: 3 of 3).
  correspondence_drop_street: true

# Measured against the final copy-edited files (tools/eval_final.py; 17 training articles): rule precision = the
# accepted changes the final text has, against those where it kept the author's wording.
autopilot:
  # Left for the editor to confirm (the rules stay on; the stylesheet / guide asks for them, the editors mostly skip):
  #   use abbreviation   S: "only abbreviation should be used thereafter" (final text 0 of 11)
  #   sections_back_matter.added  G283: "If information of SoS/CoI is not provided ... keep both as Source of support: Nil"
  #                      (the statements added with "Nil.": 0 of 3)
  #   guide.unary_comparison  G301: '"><space>10" -> ">10"' (0 of 5; editors keep the author's space)
  #   claude             Claude's copy edits (not a stylesheet rule): 22 of 50 accepted ones in the final text
  # Accepted although the word-level count looks low (the final text rewrites the words around them, so the count
  # misreads them): table captions in sentence case and with a final period (S) -- the copy editors made Title Case
  # captions sentence case in 4 of the 4 articles that had them and added the period in 9 of 17; holding both cut
  # the text closure 23.1% -> 22.5%. ref_year / ref_pages / ref_issue (S: "J Pharm Bioall Sci 2017;9:80-7", G165,
  # G169): the final lists have "Journal 2017;" in 15 of 17 articles; the misses are two lists left as typed.
  # Not held: sections_abstract.rename:methods (S, struck through but live: owner, 2026-10-26).
  hold: [sections_back_matter.consent_added, fmt_color, figure_insert, use abbreviation,
         sections_back_matter.added, guide.unary_comparison, claude]
