# Indian Journal of Nephrology / Dr. Sulaiman Al Habib Medical Journal (StyleSheet_Sample_IJN & DSHMJ.docx); only the settings that differ from base.yaml.
# Tuned against 6 style-edited articles: closure 29.0% (hurt 24) -> 31.7% (hurt 8) (base only -> this file).
name: Indian Journal of Nephrology / Dr. Sulaiman Al Habib Medical Journal

headings:
  # base list without 'abstract': the editor does not tag the Abstract heading
  h1: [introduction, materials and methods, methods, methodology, patients and methods,
       subjects and methods, results, discussion, conclusion, conclusions, references, case report,
       case reports, case presentation, review of literature]
  # base list + statistical analysis, ethical considerations, limitations (the editor tags these <H2>)
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, acknowledgment, acknowledgments, acknowledgement,
       acknowledgements, author contribution statement, author contributions,
       data availability statement, ethical approval, ethics approval, statistical analysis,
       ethical considerations, limitations]

# statistics.space_around_operators as base (G297: "add space on either side of operators")

# not yet automated:
#   - letters: add 'Dear Editor' when there is no salutation (an existing 'Sir,' is replaced)
#   - abstract for original articles only: Introduction, Methods, Results, Conclusions; under 250 words; avoid abbreviations
#   - no author queries about history dates
#   - Graph/Chart/Diagram/Video citations -> 'Figure X'

copyedit:
  claude:
    close_prefixes: true  # copy editors close up prefixes (post-operative -> postoperative): 8.0 per training article

formatting:  # measured with tools/eval_format.py against the style editors' tracked files
  body_unbold: false  # editors keep most bold in running text (4 of 12)

text:
  prefixes: {enabled: true}  # copy editors close prefixes (rules_text.py): 27 proposed, 81%

sections:
  letter_salutation: "Dear Editor,"  # S: LTE articles start with “Dear Editor” instead of “Sir” / “Dear Sir/Madam”
  back_matter:
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'
