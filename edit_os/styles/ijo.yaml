# Indian Journal of Ophthalmology (StyleSheet_Sample_IJO.docx), tuned against the
# style editor's completed IJO articles.
name: Indian Journal of Ophthalmology

headings:
  h1: [materials and methods, methods, methodology, patients and methods, subjects and methods,
       results, discussion, conclusion, conclusions, references, case report, case reports,
       case presentation, review of literature]

references:
  journal_drop_qualifier: false  # IJO editors keep NLM's qualifier: Eye (Lond), Clinics (Sao Paulo), ... (Engl Ed)

statistics:
  space_around_operators: false  # the editor does not add these for IJO

formatting:  # the IJO style editor leaves p and n as typed (lowercase, roman)
  p_values: false
  n_variable_italic: false
  body_unbold: false           # bold inside running text is left as typed (1 of 11 in 19 articles)

figures:
  # In-text citations: the IJO stylesheet says nothing on Fig./Figure (only "Picture" -> "Figure" in captions);
  # the generic guide's G203 asks for "Figure", but the IJO style editors write "Fig." / "Figs.": 64 of 75
  # citations in 19 te.docx files, 16 of 17 articles that cite figures, across editors and article types
  # (case reports, originals, reviews). The exception is one review (one editor, 8 "Figure" kept). Captions
  # keep "Figure 1:".
  figure_label: Fig.
  figure_label_plural: Figs.
  compress_lists: true          # stylesheet: "Tables 1–6"

sections:  # IJO prints no "Introduction" heading and uses "Methods" (stylesheet and editors)
  headings:
    rename: {materials and methods: Methods, material and methods: Methods, materials and method: Methods,
             subjects and methods: Methods, subject and methods: Methods, patients and methods: Methods,
             patient and methods: Methods, methodology: Methods}
    drop: [introduction]
  abstract:
    rename: {materials and methods: Methods, material and methods: Methods, methodology: Methods,
             subjects and methods: Methods, subject and methods: Methods, patients and methods: Methods,
             patient and methods: Methods, aim: Purpose, aims: Purpose}
  back_matter:  # IJO editors (19 + 2 articles): consent, contributions, financial support, conflicts
    consent:
      # The heading the IJO editor gave an unheaded statement, and the IJO reviewers' wording (the stylesheet says
      # "Declaration of patient consent"); authors' own headings are kept as written (7 of 7).
      heading: "Author’s declaration statement of patient consent"
    contributions:
      heading: "Authors’ contributions"  # 7 of 12 editor-final headings
      from_sources: true             # title page / contribution form: the editors have it in all 11 articles whose
                                     # submission lists contributions (one more found: a review the editor left)

guide_replace:
  multiplication: false  # the IJO editors leave "4.5x4.5 mm" as typed

copyedit:
  abbreviations:
    # Ophthalmic abbreviations the IJO editors never ask authors to expand (0 abbreviation queries in 19 te/ce files).
    allow: [OCT, OCTA, AS-OCT, ASOCT, SD-OCT, SS-OCT, BCVA, UCVA, CDVA, UDVA, VA, IOP, IOL, RNFL, GCL, IPL, GCIPL,
            ONH, RPE, ILM, ERM, PVR, ROP, RRD, TRD, YAG, Nd, UBM, FFA, ICGA, ERG, VEP, HFA, SITA, ETDRS, AMD, ARMD,
            DME, DR, PDR, NPDR, CNV, CSC, CSCR, POAG, PACG, OAG, PAC, LASIK, PRK, SMILE, DALK, PK, PKP, DSAEK, DMEK,
            DSEK, ICL, PPV, SLET, LSCD, KPro, BKPro, VEGF]
    full_form_after_definition: "off"  # IJO copy editors leave the full form (19 articles: precision 36%, closure -0.8%)
  claude:
    close_prefixes: true  # copy editors close up prefixes (post-operative -> postoperative): 6.9 per training article

text:  # copy-edit text rules (rules_text.py), measured on the IJO copy editors' text (19 articles)
  prefixes: {enabled: true}         # 98 proposed, 93% (with copyedit.claude.close_prefixes)
  number_words: {enabled: true}     # "three months" -> "3 months": 61, 77%
  stat_semicolons: {enabled: true}  # "(p = 0.065); at 3 months": 2 of 2
