# Indian Journal of Ophthalmology (StyleSheet_Sample_IJO.docx), tuned against the
# style editor's completed IJO articles.
name: Indian Journal of Ophthalmology

headings:
  h1: [materials and methods, methods, methodology, patients and methods, subjects and methods,
       results, discussion, conclusion, conclusions, references, case report, case reports,
       case presentation, review of literature]

references:
  journal_drop_qualifier: false  # IJO editors keep NLM's qualifier: Eye (Lond), Clinics (Sao Paulo), ... (Engl Ed)

statistics:
  space_around_operators: false  # the editor does not add these for IJO

formatting:  # the IJO style editor leaves p and n as typed (lowercase, roman)
  p_values: false
  n_variable_italic: false

figures:
  figure_label: Fig.            # IJO editors: "[Fig. 1]", "Fig. 2 shows"; captions keep "Figure 1:"
  figure_label_plural: Figs.
  compress_lists: true          # stylesheet: "Tables 1–6"

sections:  # IJO prints no "Introduction" heading and uses "Methods" (stylesheet and editors)
  headings:
    rename: {materials and methods: Methods, material and methods: Methods, materials and method: Methods,
             subjects and methods: Methods, subject and methods: Methods, patients and methods: Methods,
             patient and methods: Methods, methodology: Methods}
    drop: [introduction]
  abstract:
    rename: {materials and methods: Methods, material and methods: Methods, methodology: Methods,
             subjects and methods: Methods, subject and methods: Methods, patients and methods: Methods,
             patient and methods: Methods, aim: Purpose, aims: Purpose}

guide_replace:
  multiplication: false  # the IJO editors leave "4.5x4.5 mm" as typed

copyedit:
  abbreviations:
    full_form_after_definition: "off"  # IJO copy editors leave the full form (19 articles: precision 36%, closure -0.8%)
  claude:
    close_prefixes: true  # copy editors close up prefixes (post-operative -> postoperative): 6.9 per training article
