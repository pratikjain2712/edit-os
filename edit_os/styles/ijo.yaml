# Indian Journal of Ophthalmology (StyleSheet_Sample_IJO.docx), tuned against the
# style editor's completed IJO articles; the stylesheet and the pre-editing guide win where they speak.
name: Indian Journal of Ophthalmology

headings:
  # No "Introduction" and no "Abstract" tag: the editors' habit (the sheet is silent).
  # G139 'Content like "Case History" or "Case Report" ... should be first level heading': the case report's own
  # sections too ("Case Description", "Treatment and Outcome": IJO_1016, IJO_183).
  h1: [materials and methods, methods, methodology, patients and methods, subjects and methods,
       results, discussion, conclusion, conclusions, references, case report, case reports,
       case presentation, review of literature, case description, case history, case summary,
       treatment and outcome, treatment and outcomes,
       acknowledgment, acknowledgments, acknowledgement, acknowledgements,
       commentary, background]
  # "Background" opening a case report's text (IJO_2538: the editors tag it <H1>; the sheet's "H1 | Caps, Bold"). Untagged
  # it would stand at the heading size with no tag.
  # "Commentary": a commentary's own section heading under its article type (IJO_2904: the editors tag it <H1>; the
  # sheet is silent). The title page's "Article type: Commentary" is front matter, never tagged.
  # Acknowledgement heading first level (owner, 2026-10-26; G146 / G133: "The heading 'Acknowledgement' should be
  # 14 points font size bold style", the first level's size).
  # as base, with "Diagnosis" under a case description (IJO_1016) and an "Ethics" statement head (IJO_2891)
  h2: [conflicts of interest, conflict of interest, financial support and sponsorship,
       declaration of patient consent, author contribution statement, author contributions, data availability statement,
       ethical approval, ethics approval, ethics, ethics statement, diagnosis]
  # "References:" -> "References", "Materials and Methods:" -> "Materials and Methods", "Acknowledgment:" (body and
  # back-matter headings; not the structured abstract's run-in "Purpose:" nor "Keywords:"): the editors drop the
  # colon; G137 says retain it -- the owner follows the editors (owner, 2026-10-26).
  strip_trailing_colon: true
  # A case report's "Methods" (an ethics statement) has no sub-sections: the first own-line head in it that is not one
  # of the cases ("Literature Search Strategy" over "Case 1" ...) is a first-level section of its own (IJO_702; the
  # sheet is silent: "Headings (three levels only)", G139 the case report's sections first level)
  case_report_methods_sections: true

# references.journal_drop_qualifier: as base (Index Medicus titles keep "Eye (Lond)")
# statistics.space_around_operators: as base (G297 "add space on either side of operators"; the IJO editors leave
#   p=0.03 as typed: owner's list)
# formatting.p_values / n_variable_italic: as base (G294 / G296; the IJO editors leave p and n roman: owner's list)

formatting:
  body_unbold: false           # bold inside running text is left as typed (1 of 11 in 19 articles; sheet silent)
  heading_bold_tagged: true    # S: "H1 | Caps, Bold" and "H2 | Sentence Case, Bold": the heads the tool tags in bold
  heading_bold_levels: [1, 2]  # (S: "H3 | Sentence Case, Italics")
  et_al_italic_references: true  # guide S&R row 1: "et al." in italics, references included (only "&", row 4,
                                 # spares them); the IJO editors italicise it in the list (6 of 6 articles)
  heading_italic_levels: [3]   # S: "H3 | Sentence Case, Italics"
  heading_unbold_levels: [3]   # ... and not bold: an author's bold H3 goes roman-weight (owner, 2026-10-26)
  heading_roman_levels: [1, 2]  # S: "H1 | Title Caps, Bold, Roman", "H2 | Sentence Case, Bold, Roman"
  # Guide: 12 pt throughout, 14 pt for the article type, title, abstract heading, H1 and Acknowledgement heading,
  # left aligned, the running head centred; the sheet adds only "fourth level ... 12 points". The IJO editors set
  # the whole file in Times New Roman 12 pt (te.docx: body 17 of 19 articles, the other two left at the author's
  # 16 pt; Times New Roman in 19 of 19, the originals in 11 of 19) and never 14 pt (0 of 19: H1, title, article
  # type, abstract heading all 12 pt) nor change justified text to left (40% of the final paragraphs justified):
  # those two are the owner's list.
  fonts:
    enabled: true
    family: Times New Roman    # the guide and the sheet name no font: the editors' (19 of 19 articles)
    align: left                # G16 "left aligned" (owner, 2026-10-26: keep the guide's left alignment and 14 pt
                               # headings)
    # owner, 2026-10-27: follow the guide (G193, G194): table text 12 pt and aligned left, "No other alignment should
    # be done" -- replaces the owner's 2026-10-26 "table cells keep the alignment they were typed with"
    table_align: left
  # Greek letters, ±, ≤, ≥ and the minus sign in the Symbol font (Word's inserted symbols, w:sym), never ×, ®, ©, µ
  # (owner, 2026-10-26)
  symbol_font: {enabled: true}
  table_caption_bold: true     # owner, 2026-10-27: follow the guide (G199): label and caption content in bold
  figure_caption_plain: true   # G260: "Figure #:" bold, the caption after it plain (editors 6 of 6; the author's
                               # bold and an all-italic caption go)

citations:
  # Owner, 2026-10-26: "follow the editors" on where a citation sits. The IJO editors move it next to the study's
  # author name (as base); the JEHP editors leave it where the author put it (jehp.yaml).
  next_to_author: true
  # "[3,4,5]" -> "[3-5]", "[1,3,4,5]" -> "[1,3-5]" in every citation, not only renumbered ones (the IJO editors,
  # 510 / 837 / 702; the sheet is silent: S328 only sets the hyphen, S330 keeps two numbers a list)
  compress_from: 3

references:
  compound_surnames: author    # "Pérez de Olaguer N", "van Wijngaarden P" kept over the record's "de Olaguer NP",
                               # "Wijngaarden PV" (IJO_2904: the editors kept the author's, 5 of 5)
  clear_formatting: true      # Vancouver sets no italic or bold in an entry: the author's EndNote / APA italics and
                               # bold volumes go (JEHP 1153, 1576: 35 entries; et al. italic stays per formatting)
  web_search: {enabled: true}  # refweb.py: candidate pages from Claude's web search, verified in code (owner)
  other:
    # Owner, 2026-10-28: reports, conference papers, theses and books no database or catalogue confirms are not
    # queried (the sheet asks a PubMed check for journal articles only; editors queried none of 65). Articles
    # still are (query_unverified_articles, as base).
    query_unverified: false
    query_unverified_books: false
  label_period: true           # "1.Angus DC" -> "1. Angus DC", "1)" -> "1." (sheet silent; the IJO editors, 4 of 4)
  non_indexed_journal: iso4    # a journal NLM does not list: its ISO 4 abbreviation as the editors write it, over
                               # S "complete name of the journal for non-indexed journals" (owner, 2026-10-28)
  # max_initials: as base (none). The owner cuts initials to two for JEHP and for IJO only if its editors do; they
  # keep all of them ("Relvas LJM", "Ting DSW", "Meenink HCM": 12 of 12 in ijo_new): owner, 2026-10-26.

figures:
  # S300 "Figure citation | Fig. 1": the sheet speaks, so it wins over the guide's G240 ("Figure" for "Fig.");
  # the IJO editors write "Fig." / "Figs." too (64 of 75 citations, 16 of 17 articles).
  figure_label: Fig.
  figure_label_plural: Figs.
  compress_lists: true          # stylesheet: "Tables 1–6"
  # "visit. (Figure 1A)" -> "visit [Fig. 1A]." and "hypopyon. [Figure 1A, B]" -> "hypopyon [Fig. 1A, B].": the IJO
  # editors in every such article (2202, 2449, 1862, 3136, 510; the sheet is silent)
  before_full_stop: true
  # "{b:Table 3 and Figure 1}" in running text -> roman: the IJO editors in 6 of 6 articles (1130, 1226, 183, 1862,
  # 2202, 2835; the sheet is silent, and formatting.body_unbold stays off for other bold)
  unbold_citations: true
  # S: "In case part labels and content are present in separate paragraphs, make them run-on with space as delimiter"
  # (G264): "Fig.1 A ..." + "Fig.1 B ...", "(C) ..." / "b. ..." lines -> one legend, as the IJO editors do in all 8
  # articles with such lines (510, 702, 769, 867, 1016, 2155, 2835, 3136; in 510, 867 and 2155 by deleting the
  # paragraph marks, which tools/evaluate.py scores only with --join-paragraphs).
  legend_run_on: true
  # S: 'The label should be "Table<space>#:<space>" followed by caption content in bold style and Sentence Case.'
  table_caption_case: sentence
  # S (table footnotes): "Period should be deleted at end of last abbreviation definition" / "... at end of last
  # footnote" and "Comma should be delimiter between abbreviations" (G212, G213, G215).
  table_footnote_end_period: delete
  table_footnote_delimiter: ","
  # owner, 2026-10-27: follow the guide (G211): "term<space>=<space>definition" ("CDVA: corrected ..." / "CDVA,
  # corrected ..." -> "CDVA = corrected ...") -- replaces the owner's 2026-10-26 decision 2 (the editors' "term:
  # definition")
  table_footnote_abbreviation: " = "
  table_footnote_order: abbreviations_first  # owner, 2026-10-27: follow the guide (G214)
  # S: "The caption should end with a period": table and figure captions (owner, 2026-10-26: keep the sheet)
  table_caption_end_period: add
  figure_caption_end_period: add
  graph_caption_end_period: add
  table_heads_title_case: true  # S: "In case the content is in All Caps then please make it as Title Case" (G205)
  table_heads_case: sentence    # owner, 2026-10-27: follow the guide (G204; S: "Column heads | Sentence case, bold")
  # G265: "The caption(s) should be placed at end of document (before table if present)", G195: tables "at end of
  # document after figure captions". Legends in the body move after the references (and the First author block),
  # under a "Figure Legends" heading (the sheet is silent; the IJO editors have a heading in 17 of 18 articles with
  # legends: "Figure Legends" 10, "Figure Legend" 4, "Figure legends" 3).
  legends_to_end: true
  legends_heading: Figure Legends
  legends_heading_single: Figure Legend   # one figure: the editors' singular in 4 of 5 (702, 1016, 2155, 2698)
  # The sheet is silent on where a table caption sits; the IJO editors put it in a merged first row of the table in
  # every article with tables (8 of 8: 769, 1130, 1226, 1862, 2835, 2891, 3136, 510), above or below it as typed.
  table_caption_row: true
  # owner, 2026-10-27: follow the guide (G195): the tables at the end of the document, after the figure captions (the
  # back reads: references, First author, Figure Legends, tables); no heading over them (the guide names none)
  tables_to_end: true

# owner, 2026-10-27: follow the guide (G196, G206, G208, G209)
tables:
  indent: {enabled: true}
  delete_empty_cell_paragraphs: true
  empty_head_query: true
  cell_rows_query: true

front_matter:
  # A street address only, in the corresponding author's city: the affiliation's institution in front of it (IJO_769;
  # S: "In case correspondence content is not present separately but the same is present in affiliation then it
  # should be used"). Not before a home address (flat, society, quarters).
  correspondence_add_institution: true
  initial_period: false  # S: 'In author name no need dot (.) in middle name “John B John'
  # S: 'Country name must be added at the end if it is not present; delete pin/zip code': the postal codes go from
  # the affiliations (the editors: none in 38 articles). This reverses the 2026-10-26 read-back of the title page's
  # postal code (owner, 2026-10-27: follow the sheet). "Faculty of ..." units stay as written (owner, 2026-10-26).
  affiliation_postal_code: false
  delete_postal_codes: true
  # The sheet's "delete pin/zip code" is an Affiliation line; its Correspondence lines are silent. The IJO editors keep
  # the correspondence address's postal code ("Porai - 841 219, Bihar, India", "Wuhan, 430070, China": 15 of the 17
  # articles whose title page gives one; deleted in 1862, 2456) and never ask for a missing one (0 of 38): owner,
  # 2026-10-28, follow the editors on postal codes.
  correspondence_postal_code: true
  # Author queries in the IJO editors' wording (the sheet is silent):
  queries:
    # an affiliation with no department or unit ("Gokhale Eye Hospital", "Oculoplasty Services", "Anant Bajaj Retina
    # Institute"): "Kindly provide department" in 13 of the 13 articles that have one; not asked in 2 (702, 2155).
    # One query on the affiliation line ("Kindly provide department names." for several), on the first of them
    department: true
    # a history date the XML lacks ("Revised: ???"): "Kindly provide missing revised date" in 6 of 6
    missing_dates: true
  # The first affiliation is numbered from 1 like the others: the written rule ("link the unlinked affiliations and
  # renumber the links") wins over the sheet's example, which leaves the first unnumbered (owner, 2026-10-27).
  affiliation_first_unnumbered: false

sections:
  letter_salutation: "Dear Editor,"  # S: LTE articles start with “Dear Editor” instead of “Sir” / “Dear Sir/Madam”
  headings:
    # S: 'Materials and Methods”, “Subject and Methods”, “Patient and Methods” etc. change as only “Methods'
    # ... and say so on the heading: "Heading has been changed to Methods as per journal specification." (the editors
    # in 4 of the 6 articles with such a rename: 1351, 407, 880, 888; not 3136, 942)
    rename_query: true
    rename: {methods: Methods, method: Methods,
             materials and methods: Methods, material and methods: Methods, materials and method: Methods,
             subjects and methods: Methods, subject and methods: Methods, patients and methods: Methods,
             patient and methods: Methods, methodology: Methods}
    case: title  # S: "H1 | Caps, Bold, Roman" -- "Caps" read as capitalised words (Title case): owner confirmed 2026-10-24; the IJO editors use Title case
    drop: [introduction]  # the IJO editors delete the Introduction heading (the sheet is silent)
    bold: true  # S: "H1 | Caps, Bold" / "H2 | Sentence Case, Bold": the recognised headings in bold
    reference_heading: References  # "Reference" over the list -> "References" (IJO_2891; S: "References")
    strip_sub_numbering: true  # "3.2 Association between ..." -> "Association between ..." on a sub-heading (IJO_2891;
                               # the sheet is silent)
  abstract:
    # S: 'Change “Aim” to “Purpose' and 'Materials and Methods”, “Subject and Methods”, “Patient and Methods” etc.
    # change as only “Methods'
    rename: {materials and methods: Methods, material and methods: Methods, methodology: Methods,
             subjects and methods: Methods, subject and methods: Methods, patients and methods: Methods,
             patient and methods: Methods, aim: Purpose, aims: Purpose}
    word_limit_query: false  # the IJO sheet has no word-limit line
    # S: 'Change “Aim” to “Purpose', '... change as only “Methods', 'raise a query for “Conclusion” if missing' and
    # "Raise query in case of any deviation from these headings": other sub-headings ("Design", "Setting") queried
    headings: [Purpose, Methods, Results, Conclusion]
    heading_case: true       # S: 'The word "Abstract" should be added as heading': "ABSTRACT" (typed or all-caps) -> "Abstract"
    heading_bold: true       # ... 'in bold style and left aligned' (an inline "ABSTRACT: We report ..." split off)
    unbold_text: true        # S: "Abstract text should not be in bold"
  keywords:
    max_query: false         # owner, 2026-10-28: no "Kindly provide a maximum of 5 key words" (the sheet asks only
                             # about too few; editors never asked it)
    after_abstract: true     # S: "Should appear in a separate line after the Abstract" (key words above it move)
    label_bold: true         # S176: 'Heading should be "Keywords:" followed by a colon, bold'
    run_on: true             # S182 "Keywords: Acceptability, Hall’s technique, ...": a list on the next line runs on
    from_xml: true           # none in the manuscript: the submission XML's (editors: "Followed XML file for Keywords",
                             # 3 of 3 articles whose XML has them) instead of the query
  back_matter:  # IJO editors (19 + 2 articles): consent, contributions, financial support, conflicts
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'
    # A declaration found only on the title page (or a declaration file) -- funding, conflicts, ethics, data
    # availability, AI use -- is used in the back matter (owner, 2026-10-27; G283)
    statements_from_sources: [funding, conflict, ethics, data, ai]
    split_ethics: true  # "Ethical approval: All procedures ..." -> H2 heading + statement (IJO_1745; S: H2 headings)
    acknowledgement_from_sources: true  # S382 "Acknowledgments | This section is not mandatory. Retain if given"
    acknowledgement_heading: Acknowledgement  # G146 (UK spelling), first level (owner, 2026-10-26)
    heading_bold: true  # S: "H2 | Sentence Case, Bold": the section headings added, renamed or split off are bold
    consent:
      # S392: 'Placement is before the "Financial support and sponsorship" section': a consent section after the
      # references / legends or after the funding and conflicts statements is moved there (the editors in 6 of 6).
      move: true
      # S388 'Declaration of Patient Consent | “Declaration of patient consent” should be present': the author's own
      # consent heading ("Author’s Declaration statement-", "Authors’ Declaration", "Patient consent") takes the
      # sheet's (the IJO editors 2 of 2: 1432, 1347; owner, 2026-10-27: keep the guide / sheet)
      rename_heading: true
    contributions:
      heading: "Authors’ contributions"  # 7 of 12 editor-final headings (the sheet is silent)
      from_sources: true             # title page / contribution form: the editors have it in all 11 articles whose
                                     # submission lists contributions (one more found: a review the editor left)
      # Statements on the manuscript's own title page go to the back under the heading, with a closing "All authors
      # read and approved ..." line right after them (IJO_702, the only such article in the 273 samples: the technical
      # editor moved all three statements; owner: follow him. He kept that closing line with the statements in 4 of
      # 5 IJO articles, all but IJO_702).
      move_from_top: true
    # The stylesheet is silent on a first-author block; the IJO technical editors consistently add one (21 of 22
    # articles), kept by the copy editors: label, full name, affiliation, after the references.
    # Not for a plain "Letter to Editor" (the editor added none; owner confirmed 2026-10-24); the stand-alone
    # "Letter to Editor (Stand-alone brief communications ...)" gets one, as the editor did.
    # photo_query: "Kindly provide photo and designation for the first author." on the block's label: the editors in
    # 37 of the 37 articles that get the block (the designation alone where the submission has the author's
    # photograph: 1184 "First author photograph.jpg").
    first_author: {enabled: true, skip_types: [Letter to Editor, Letter to the Editor], photo_query: true}

# guide_replace.multiplication: as base (G315 "10x20" -> "10 × 20"; the IJO editors leave "4.5x4.5 mm": owner's list)
guide_replace:
  # G300 / G301: no space after a unary sign ("< 0.001" -> "<0.001", "- 0.5" -> "−0.5") in table cells too
  # (owner, 2026-10-26)
  table_rules: [unary_minus, unary_comparison]

copyedit:
  # abbreviations: as base. S: "All abbreviations should be expanded at the first instance followed by abbreviation
  # in parentheses (only abbreviation should be used thereafter)" and "Look for undefined acronyms and raise query":
  # the ophthalmic allow-list (OCT, BCVA, IOP, ...) and full_form_after_definition: off are gone (the IJO copy
  # editors never query them: owner's list).
  abbreviations:
    defined_in_article: true  # an acronym the article expands elsewhere (abstract, list, table note) is not queried
                              # as undefined (owner, 2026-10-28: no queries the editors would not add; 119 -> 96)
    redefinition: change      # "full form (ABBR)" again -> "ABBR" (S: "only abbreviation should be used thereafter"),
                              # made rather than queried (owner, 2026-10-28)
  # Owner, 2026-10-28: the editing agent (edit_os/agent) on for IJO as a pilot: its edits are left for the editor
  # (autopilot.hold: agent) and grouped as one rule ("Reject all like this" clears them). Held-out IJO 2134: 71% of
  # its edits the copy editor's, closure 9.6% (the Claude pass 56%, 2.4%); $0.12-0.56 per article.
  agent:
    enabled: true
    max_queries: 5             # owner, 2026-10-28: cap the judgement queries (it asked 2-19 per article)
  claude:
    max_queries_per_article: 3  # "awkward or confusing" queries capped (owner, 2026-10-28; 33 in 38 articles)
    model: claude-opus-5-5  # owner, 2026-10-28: IJO 888 (held out) 19 edits, 18 the copy editor's; Haiku 10 (see jehp.yaml)
    close_prefixes: true  # copy editors close up prefixes (post-operative -> postoperative): 6.9 per training article

text:  # copy-edit text rules (rules_text.py), measured on the IJO copy editors' text (19 articles; the sheet is silent)
  prefixes: {enabled: true}         # 98 proposed, 93% (with copyedit.claude.close_prefixes)
  number_words: {enabled: true}     # "three months" -> "3 months": 61, 77%
  stat_semicolons: {enabled: true}  # "(p = 0.065); at 3 months": 2 of 2

autopilot:
  # base's holds, and the editing agent's edits (pilot, owner 2026-10-28): the editor judges them, Autopilot never
  # accepts them
  hold: [sections_back_matter.consent_added, fmt_color, figure_insert, submission_reviewer_reply, agent]
