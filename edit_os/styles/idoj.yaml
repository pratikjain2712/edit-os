# Indian Dermatology Online Journal (StyleSheet_Sample_IDOJ.docx); only the settings that differ from base.yaml.
# Tuned against 3 style-edited articles: closure 23.4% (hurt 8) -> 24.0% (hurt 7) (base only -> this file).
name: Indian Dermatology Online Journal

# not yet automated:
#   - letters: add 'Dear Editor' when there is no salutation (an existing 'Sir,' is replaced)
#   - structured abstracts also for brief reports and review articles
#   - history dates: 'Received: Month, Year. Accepted: Month, Year.'

sections:
  letter_salutation: "Dear editor,"  # S: "For letter to Editor articles always have “Dear editor” instead of “Sir”"
  back_matter:
    contributions:  # editors copy the title page's "Authors' Contributions:" statement (2 of 2 given as text)
      heading: "Authors’ contributions"
      from_sources: true
    supplementary_heading: Supplementary Material  # S: 'please add the heading “Supplementary Material”'


text:
  number_words: {enabled: true}  # copy editors: "three months" -> "3 months" (rules_text.py): 12 proposed, 100%
